<!doctype html>
<!-- 폰으로 보기(1.6). ponytail: 정적 한 장 + 프레임워크 없는 JS. Mac 앱(Remote.swift)이 중계 서버(server/brag.py relay/…)에 올린
     상태를 5초마다 읽고, 버튼은 명령을 남긴다. 게임 규칙·가격은 Mac 이 계산해 보내므로 여기엔 없다.
     키는 주소 # 뒤(k=)와 localStorage 에만 둔다. 홈 화면에 추가할 때 키가 따라가도록 주소에 남겨 둔다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Lemon Desk</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lemon Desk">
<meta name="theme-color" content="#FFFBEC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14170F" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="../icon.png?v=1">
<link rel="icon" href="../icon.png?v=1">
<style>
  :root {
    --bg: #FFFBEC; --ink: #23511F; --text: #3E4A33; --muted: #646D57; --card: #FFFFFF; --line: #EDE6CC;
    --lemon: #F5CE2E; --lemon-soft: #FFF3C2; --leaf: #2E7D32; --on-leaf: #FFFFFF; --track: #EFE8CF; --warn: #8A5A00; --warn-bg: #FFF1CC;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14170F; --ink: #EEF3DF; --text: #C9CFBA; --muted: #A2A991; --card: #1C2016; --line: #2D3324;
            --lemon-soft: #2C2A14; --track: #2D3324; --warn: #F2D27A; --warn-bg: #2E2711; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
    word-break: keep-all; -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 0 16px 32px; }
  h1, h2 { margin: 0; color: var(--ink); letter-spacing: -0.02em; }
  h2 { font-size: 18px; }
  p { margin: 0; }
  a { color: var(--ink); text-underline-offset: 3px; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 8px; }
  [hidden] { display: none !important; }
  .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }
  img.px { image-rendering: pixelated; }

  header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 0 12px; }
  .brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; color: var(--ink); font-size: 17px; }
  .brand img { width: 28px; height: 28px; border-radius: 7px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); padding: 4px 10px;
          border: 1px solid var(--line); border-radius: 999px; background: var(--card); }
  .chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .chip.on { color: var(--ink); }
  .chip.on::before { background: #3FA34D; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .hero .row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .hero .label { font-weight: 600; color: var(--ink); }
  .hero .count { font-size: 28px; font-weight: 700; color: var(--ink); }
  .bar { height: 10px; border-radius: 999px; background: var(--track); overflow: hidden; margin: 10px 0 8px; }
  .bar i { display: block; height: 100%; min-width: 10px; border-radius: 999px; background: var(--leaf); transition: width .4s ease-out; }
  .hero .full { font-size: 14px; }
  .coins { display: flex; align-items: center; gap: 6px; font-weight: 700; color: var(--ink); font-size: 18px; margin-top: 12px; }
  .coins img { width: 18px; height: 16px; }
  button { font: inherit; cursor: pointer; touch-action: manipulation; }
  .primary { width: 100%; min-height: 52px; margin-top: 14px; border: 0; border-radius: 14px; background: var(--leaf); color: var(--on-leaf);
             font-size: 17px; font-weight: 700; }
  .primary:active:not(:disabled) { opacity: .85; }
  button:disabled { opacity: .45; cursor: default; }

  .banner { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: var(--warn-bg); color: var(--warn); font-size: 14px; }
  .toast { min-height: 1.5em; margin: 12px 4px 0; font-size: 15px; color: var(--ink); font-weight: 600; }

  section.list { margin-top: 20px; }
  section.list > p { font-size: 14px; margin-top: 2px; }
  ul.rows { list-style: none; margin: 10px 0 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
  ul.rows li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; min-height: 64px; }
  ul.rows li + li { border-top: 1px solid var(--line); }
  .pic { width: 48px; height: 44px; display: flex; align-items: flex-end; justify-content: center; flex: none; }
  .pic img { max-width: 48px; max-height: 44px; }
  .info { flex: 1; min-width: 0; }
  .info b { display: block; color: var(--ink); font-weight: 600; overflow-wrap: anywhere; }
  .info span { font-size: 13px; color: var(--muted); }
  .buy { flex: none; min-width: 88px; min-height: 44px; padding: 6px 12px; border-radius: 12px; border: 1px solid var(--line);
         background: var(--lemon-soft); color: var(--ink); font-weight: 600; font-size: 15px; display: inline-flex; flex-direction: column;
         align-items: center; justify-content: center; line-height: 1.2; }
  .buy small { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 500; }
  .buy small img { width: 12px; height: 11px; }
  .buy:active:not(:disabled) { opacity: .8; }

  .gate { margin-top: 24px; text-align: center; }
  .gate h1 { font-size: 24px; margin: 16px 0 8px; }
  .gate img { width: 72px; height: 72px; border-radius: 16px; }
  .gate ol { text-align: left; display: inline-block; margin: 16px 0 0; padding-left: 1.3em; }
  .party { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 10; }
  .party .card2 { width: 220px; padding: 18px 16px 16px; text-align: center; border-radius: 18px; background: #FFF6DA; border: 3px solid #C98A2E;
                  box-shadow: 0 10px 30px rgba(0,0,0,.25); color: #4A2E14; animation: pop 2.6s ease-out forwards; }
  .party .card2 b { display: block; font-size: 16px; margin-bottom: 8px; color: #6B3F00; }
  .party .card2 img { height: 110px; image-rendering: pixelated; }
  .party .card2 span { display: block; margin-top: 8px; font-weight: 700; }
  @keyframes pop { 0% { transform: translateY(40vh) scale(.3); opacity: 0 } 18% { transform: none; opacity: 1 } 80% { opacity: 1 } 100% { opacity: 0 } }
  @media (prefers-reduced-motion: reduce) { .party .card2 { animation: fadeonly 2.6s forwards; } @keyframes fadeonly { 0%, 100% { opacity: 0 } 10%, 80% { opacity: 1 } } }
  footer { margin-top: 32px; font-size: 13px; color: var(--muted); text-align: center; }
  footer p + p { margin-top: 6px; }
  @media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="brand"><img src="../icon.png?v=1" alt="" width="28" height="28">Lemon Desk</span>
    <span class="chip" id="chip" hidden></span>
  </header>

  <main id="app" hidden>
    <section class="card hero" aria-labelledby="crate-label">
      <div class="row">
        <span class="label" id="crate-label" data-t="crate">창고</span>
        <span class="count num" id="count">0 / 0</span>
      </div>
      <div class="bar" aria-hidden="true"><i id="bar" style="width:0"></i></div>
      <p class="full muted num" id="full"></p>
      <button class="primary" id="sell" type="button" data-t="sell">모두 팔기</button>
      <div class="coins"><img class="px" src="../brag/sprites/coin.png" alt="" width="18" height="16"><span class="num" id="coins">0</span></div>
    </section>
    <p class="banner" id="asleep" hidden></p>
    <p class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></p>

    <section class="list" aria-labelledby="plant-h">
      <h2 id="plant-h" data-t="plant">나무 심기</h2>
      <p class="muted num" id="field"></p>
      <ul class="rows" id="kinds"></ul>
    </section>
    <section class="list" id="unlock-sec" aria-labelledby="unlock-h" hidden>
      <h2 id="unlock-h" data-t="unlock">새 종류 해금</h2>
      <p class="muted" data-t="unlockNote">해금하면 그 종류를 심을 수 있어요. 해금만으로는 나무가 생기지 않아요.</p>
      <ul class="rows" id="unlock"></ul>
    </section>
    <section class="list" aria-labelledby="workers-h">
      <h2 id="workers-h" data-t="workers">일꾼</h2>
      <ul class="rows" id="workers"></ul>
    </section>
    <section class="list" aria-labelledby="crate-h">
      <h2 id="crate-h" data-t="crateUp">창고 넓히기</h2>
      <ul class="rows" id="crate"></ul>
    </section>
  </main>

  <section class="gate" id="gate" hidden>
    <img src="../icon.png?v=1" alt="" width="72" height="72">
    <h1 id="gate-title"></h1>
    <p class="muted" id="gate-text"></p>
    <ol id="gate-steps"></ol>
  </section>

  <footer>
    <p id="home-tip"></p>
    <p><a href="../privacy.html" data-t="privacy">개인정보 처리방침</a></p>
  </footer>
</div>

<script>
(() => {
  const LOCAL = /^(127\.0\.0\.1|localhost)$/.test(location.hostname);
  const API = LOCAL ? location.origin + '/lemondesk/api/relay/' : 'https://lemondesk-api.interaction.hnine.com/api/relay/';
  const SPRITES = '../brag/sprites/';
  const en = (navigator.language || '').toLowerCase().startsWith('en');
  const kindsKo = {eureka: '유레카 레몬', kumquat: '금귤', meyer: '마이어 레몬', calamansi: '깔라만시', lime: '라임', blood: '블러드 오렌지',
    yuja: '유자', grapefruit: '자몽', pink: '핑크 레몬', hallabong: '한라봉', buddha: '불수감', golden: '황금 레몬', rainbow: '무지개 레몬',
    redhyang: '레드향', cheonhye: '천혜향', bergamot: '베르가못', pomelo: '포멜로', fingerlime: '핑거라임', trifoliate: '탱자', snowyuja: '눈꽃 유자', moonlemon: '달빛 레몬'};
  const kindsEn = {eureka: 'Eureka lemon', kumquat: 'Kumquat', meyer: 'Meyer lemon', calamansi: 'Calamansi', lime: 'Lime', blood: 'Blood orange',
    yuja: 'Yuja', grapefruit: 'Grapefruit', pink: 'Pink lemon', hallabong: 'Hallabong', buddha: "Buddha's hand", golden: 'Golden lemon', rainbow: 'Rainbow lemon',
    redhyang: 'Red-hyang', cheonhye: 'Cheonhyehyang', bergamot: 'Bergamot', pomelo: 'Pomelo', fingerlime: 'Finger lime', trifoliate: 'Trifoliate orange', snowyuja: 'Snowflake yuja', moonlemon: 'Moonlight lemon'};
  // 받침이 있으면 '을', 없으면 '를'
  const obj = s => { const c = s.charCodeAt(s.length - 1) - 0xAC00; return s + (c >= 0 && c < 11172 && c % 28 ? '을' : '를'); };
  const T = en ? {
    newKind: 'A new tree is open!', crate: 'Crate', sell: 'Sell all', sellFor: v => `Sell all +${v}`, plant: 'Plant trees', unlock: 'Unlock a new kind',
    unlockNote: "Unlocking lets you plant that kind. It doesn't plant a tree by itself.", workers: 'Workers', crateUp: 'Bigger crate', privacy: 'Privacy Policy',
    fullIn: t => `Full in ${t}`, full: 'The crate is full', slow: 'Filling slowly', field: (n, m) => `Field ${n} / ${m}`,
    kinds: kindsEn, roles: {planter: 'Planter', caretaker: 'Caretaker', harvester: 'Harvester'},
    count: n => `${n} planted`, none: 'None yet', level: (l, m) => `Level ${l} / ${m}`, crateLevel: (l, c) => `Level ${l} · holds ${c}`,
    plantBtn: 'Plant', unlockBtn: 'Unlock', hireBtn: 'Hire', upBtn: 'Level up', growBtn: 'Expand', fieldFull: 'Field full', maxed: 'Max level',
    more: n => `${n} more kinds after this.`,
    online: 'Mac connected', asleepChip: 'Mac asleep', offline: "Can't connect",
    asleep: ago => `Your Mac is asleep${ago ? ` (last seen ${ago})` : ''}, so you can only look for now. Wake it to sell and plant again.`,
    noState: 'Wake your Mac to see your orchard.',
    sold: e => e > 0 ? `Sold! +${fmt(e)} coins` : 'No lemons to sell yet', planted: k => `Planted a ${T.kinds[k]}`,
    unlocked: k => `Unlocked ${T.kinds[k]}. You can plant it now`, hired: r => `${T.roles[r]} leveled up`, grown: 'Crate expanded',
    poor: 'Not enough coins', unavailable: "That can't be done right now", noAnswer: "Your Mac didn't answer. Try again in a moment.",
    tooMany: 'Too many taps. Try again in a moment.', failed: "Couldn't send. Check your connection.",
    welcome: 'Open Lemon Desk on your Mac', welcomeText: 'This page shows your Mac orchard on your phone.',
    steps: ['On your Mac, click the lemon in the menu bar › Open Orchard… › Settings, and turn on Phone view.', 'Scan the QR code with your phone camera.'],
    lost: 'Disconnected', lostText: 'The connection was reset on your Mac. Scan the new QR code in Settings › Phone view.',
    homeTip: 'Tip: add this page to your Home Screen to open it like an app.',
    ago: s => s < 60 ? 'just now' : s < 3600 ? `${Math.round(s / 60)} min ago` : `${Math.round(s / 3600)} h ago`,
  } : {
    newKind: '새 나무가 열렸어요', crate: '창고', sell: '모두 팔기', sellFor: v => `모두 팔기 +${v}`,
    fullIn: t => `가득까지 ${t}`, full: '창고가 가득 찼어요', slow: '천천히 차는 중', field: (n, m) => `밭 ${n} / ${m}칸`,
    kinds: kindsKo, roles: {planter: '심기 일꾼', caretaker: '돌보기 일꾼', harvester: '수확 일꾼'},
    count: n => `${n}그루`, none: '아직 없음', level: (l, m) => `레벨 ${l} / ${m}`, crateLevel: (l, c) => `레벨 ${l} · ${c}개 보관`,
    plantBtn: '심기', unlockBtn: '해금', hireBtn: '고용', upBtn: '레벨업', growBtn: '넓히기', fieldFull: '밭이 다 찼어요', maxed: '최고 레벨',
    more: n => `그 뒤로 ${n}종이 더 있어요.`,
    online: 'Mac 연결됨', asleepChip: 'Mac 잠자는 중', offline: '연결할 수 없어요',
    asleep: ago => `Mac이 잠자는 중이라${ago ? `(마지막 연결 ${ago})` : ''} 지금은 보기만 돼요. Mac을 깨우면 다시 팔고 심을 수 있어요.`,
    noState: 'Mac을 깨우면 과수원이 보여요.',
    sold: e => e > 0 ? `팔았어요 · +${fmt(e)} 코인` : '아직 팔 레몬이 없어요', planted: k => `${obj(T.kinds[k])} 심었어요`,
    unlocked: k => `${obj(T.kinds[k])} 해금했어요. 이제 심을 수 있어요`, hired: r => `${T.roles[r]} 레벨이 올랐어요`, grown: '창고를 넓혔어요',
    poor: '코인이 모자라요', unavailable: '지금은 할 수 없어요', noAnswer: 'Mac이 답하지 않아요. 잠시 뒤에 다시 해 주세요.',
    tooMany: '너무 자주 눌렀어요. 잠시 뒤에 다시 해 주세요.', failed: '보내지 못했어요. 인터넷 연결을 확인해 주세요.',
    welcome: 'Mac에서 Lemon Desk를 열어 주세요', welcomeText: '이 페이지는 Mac의 과수원을 폰에서 보여 줘요.',
    steps: ['Mac 메뉴바의 레몬 › 과수원 관리… › 설정에서 폰으로 보기를 켜요.', '폰 카메라로 QR을 찍어요.'],
    lost: '연결이 끊겼어요', lostText: 'Mac에서 연결을 끊었어요. 설정 › 폰으로 보기의 새 QR을 다시 찍어 주세요.',
    homeTip: '홈 화면에 추가하면 앱처럼 열 수 있어요.',
    ago: s => s < 60 ? '방금' : s < 3600 ? `${Math.round(s / 60)}분 전` : `${Math.round(s / 3600)}시간 전`,
  };
  const $ = id => document.getElementById(id);
  const fmt = n => new Intl.NumberFormat(en ? 'en' : 'ko').format(n);
  if (en) {
    document.documentElement.lang = 'en';
    document.querySelectorAll('[data-t]').forEach(el => { if (typeof T[el.dataset.t] === 'string') el.textContent = T[el.dataset.t]; });
  }
  $('home-tip').textContent = T.homeTip;

  // 키: QR 주소의 # 뒤 → localStorage. 저장된 키로 열었으면 주소에 다시 붙여 홈 화면에 추가할 때 따라가게 한다.
  const hashKey = new URLSearchParams(location.hash.slice(1)).get('k');
  if (hashKey && /^[0-9a-f]{64}$/.test(hashKey)) localStorage.setItem('ld-remote', hashKey);
  let key = localStorage.getItem('ld-remote');
  if (key && hashKey !== key) history.replaceState(null, '', location.pathname + location.search + '#k=' + key);

  const gate = (title, text, steps) => {
    $('app').hidden = true; $('chip').hidden = true; $('gate').hidden = false;
    $('gate-title').textContent = title; $('gate-text').textContent = text;
    $('gate-steps').replaceChildren(...(steps || []).map(s => { const li = document.createElement('li'); li.textContent = s; return li; }));
  };
  if (!key) { gate(T.welcome, T.welcomeText, T.steps); return; }

  const api = async (path, opt = {}) => {
    const r = await fetch(API + path, {...opt, cache: 'no-store', headers: {'Content-Type': 'application/json', Authorization: 'Bearer ' + key}});
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(body.error || r.status), {status: r.status});
    return body;
  };

  let data = null, offset = 0, failed = false;
  const pending = new Map(); // 명령 id → {action, kind, role, at}
  const nowSec = () => (Date.now() + offset) / 1000;
  const state = () => data && data.state;
  const moment = () => {
    const tl = state()?.timeline || [];
    let m = tl[0];
    for (const x of tl) { if (x.t <= nowSec()) m = x; else break; }
    return m;
  };
  const canAct = () => !!(data && data.online && state() && !failed);
  const toast = msg => { $('toast').textContent = msg; clearTimeout(toast.t); toast.t = setTimeout(() => { $('toast').textContent = ''; }, 5000); };
  const clock = s => {
    s = Math.max(0, Math.ceil(s));
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = String(s % 60).padStart(2, '0');
    return h ? `${h}:${String(m).padStart(2, '0')}:${sec}` : `${m}:${sec}`;
  };

  const img = (src, w, h) => { const i = document.createElement('img'); i.className = 'px'; i.src = src; i.alt = ''; if (w) i.width = w; if (h) i.height = h; return i; };
  const row = (pic, name, sub, btn) => {
    const li = document.createElement('li');
    const p = document.createElement('span'); p.className = 'pic'; if (pic) p.append(pic);
    const info = document.createElement('span'); info.className = 'info';
    const b = document.createElement('b'); b.textContent = name; const s = document.createElement('span'); s.textContent = sub;
    info.append(b, s); li.append(p, info, btn); return li;
  };
  // 1.7 축하 카드: 폰에서 새 종류를 해금하면(Mac 에는 띄우지 않는다)
  const party = (title, img, name) => {
    const box = document.createElement('div'); box.className = 'party'; box.setAttribute('aria-hidden', 'true');
    const c = document.createElement('div'); c.className = 'card2';
    const b = document.createElement('b'); b.textContent = title;
    const i = document.createElement('img'); i.src = img; i.alt = '';
    const s = document.createElement('span'); s.textContent = name;
    c.append(b, i, s); box.append(c); document.body.append(box);
    setTimeout(() => box.remove(), 2700);
  };
  // 버튼: 이름 + 가격(코인). cost 가 null 이면 못 함(reason), 코인이 모자라면 흐리게.
  const buyBtn = (label, cost, reason, run) => {
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'buy';
    btn.append(document.createTextNode(cost == null ? reason : label));
    if (cost != null) {
      const sm = document.createElement('small'); sm.append(img(SPRITES + 'coin.png', 12, 11), document.createTextNode(fmt(cost)));
      btn.append(sm);
      btn.setAttribute('aria-label', `${label}, ${fmt(cost)} ${en ? 'coins' : '코인'}`);
    }
    btn.disabled = cost == null || cost > state().coins || !canAct();
    btn.onclick = () => run(btn);
    return btn;
  };
  const tier = l => [5, 10, 15, 20].filter(x => l >= x).length;

  function renderLists() {
    const s = state(); if (!s) return;
    $('field').textContent = T.field(s.trees, s.maxTrees);
    $('kinds').replaceChildren(...s.kinds.map(k => row(img(`${SPRITES}tree-${k.kind}.png`), T.kinds[k.kind] || k.kind, T.count(k.count),
      buyBtn(T.plantBtn, k.cost, T.fieldFull, b => send({action: 'plant', kind: k.kind}, b)))));
    $('unlock-sec').hidden = !s.unlock;
    if (s.unlock) {
      const u = s.unlock;
      $('unlock').replaceChildren(row(img(`${SPRITES}tree-${u.kind}.png`), T.kinds[u.kind] || u.kind, u.more ? T.more(u.more) : '',
        buyBtn(T.unlockBtn, u.cost, '', b => send({action: 'unlock', kind: u.kind}, b))));
    }
    $('workers').replaceChildren(...s.workers.map(w => {
      const t = tier(Math.max(1, w.level));
      return row(img(`${SPRITES}${w.role}${t ? '-t' + t : ''}-idle-0.png`), T.roles[w.role] || w.role, w.level ? T.level(w.level, w.max) : T.none,
        buyBtn(w.level ? T.upBtn : T.hireBtn, w.cost, T.maxed, b => send({action: 'hire', role: w.role}, b)));
    }));
    $('crate').replaceChildren(row(img('crate.png'), T.crate, T.crateLevel(s.crate.level, fmt(s.crate.capacity)),
      buyBtn(T.growBtn, s.crate.cost, T.maxed, b => send({action: 'crate'}, b))));
  }

  // 매초: 시간에 따라 바뀌는 것(창고 숫자·남은 시간·판매 금액). 숫자는 Mac 이 계산해 보낸 타임라인에서 고른다.
  function tick() {
    const s = state();
    if (!s) { $('sell').disabled = true; return; }
    const m = moment() || {crate: 0, value: 0};
    const cap = s.crate.capacity;
    $('count').textContent = `${fmt(m.crate)} / ${fmt(cap)}`;
    $('bar').style.width = `${Math.min(100, m.crate / Math.max(1, cap) * 100)}%`;
    const left = s.fullAt == null ? null : s.fullAt - nowSec();
    $('full').textContent = m.crate >= cap || (left != null && left <= 0) ? T.full : left == null ? T.slow : T.fullIn(clock(left));
    $('sell').textContent = m.value > 0 ? T.sellFor(fmt(m.value)) : T.sell;
    $('sell').disabled = !canAct() || m.crate === 0;
  }

  function render() {
    $('gate').hidden = true; $('app').hidden = false; $('chip').hidden = false;
    const s = state();
    const ago = data && data.macSeen ? T.ago(nowSec() - data.macSeen) : '';
    $('chip').className = 'chip' + (canAct() ? ' on' : '');
    $('chip').textContent = failed ? T.offline : data.online ? T.online : T.asleepChip;
    $('asleep').hidden = !data || data.online || failed;
    $('asleep').textContent = s ? T.asleep(ago) : T.noState;
    $('coins').textContent = s ? fmt(s.coins) : '–';
    for (const r of s?.results || []) {
      const p = pending.get(r.id); if (!p) continue;
      pending.delete(r.id);
      if (r.ok && p.action === 'unlock') party(T.newKind, `${SPRITES}tree-${p.kind}.png`, T.kinds[p.kind] || p.kind);
      toast(!r.ok ? T[r.reason] || T.unavailable : p.action === 'sell' ? T.sold(r.earned || 0) : p.action === 'plant' ? T.planted(p.kind)
        : p.action === 'unlock' ? T.unlocked(p.kind) : p.action === 'hire' ? T.hired(p.role) : T.grown);
    }
    for (const [id, p] of pending) if (Date.now() - p.at > 8000) { pending.delete(id); toast(T.noAnswer); }
    renderLists();
    tick();
  }

  let timer;
  async function refresh() {
    clearTimeout(timer);
    try {
      const d = await api('view');
      offset = d.now * 1000 - Date.now();
      data = d; failed = false;
    } catch (e) {
      if (e.status === 401) { localStorage.removeItem('ld-remote'); history.replaceState(null, '', location.pathname); gate(T.lost, T.lostText); return; }
      failed = true;
    }
    if (data) render(); else { $('app').hidden = false; $('chip').hidden = false; $('chip').textContent = T.offline; }
    // 명령 결과를 기다리는 동안은 1초마다, 평소엔 5초마다(화면이 보일 때만)
    if (document.visibilityState === 'visible') timer = setTimeout(refresh, pending.size ? 1000 : 5000);
  }

  async function send(cmd, btn) {
    const id = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(16) + Math.random().toString(16).slice(2)).slice(0, 40);
    btn.disabled = true; btn.setAttribute('aria-busy', 'true');
    try {
      await api('command', {method: 'POST', body: JSON.stringify({id, ...cmd})});
      pending.set(id, {...cmd, at: Date.now()});
    } catch (e) {
      toast(e.status === 409 ? T.asleep('') : e.status === 429 ? T.tooMany : T.failed);
    }
    btn.removeAttribute('aria-busy');
    refresh();
  }

  $('sell').onclick = () => send({action: 'sell'}, $('sell'));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });
  setInterval(() => { if (document.visibilityState === 'visible') tick(); }, 1000);
  refresh();
})();
</script>
</body>
</html>
