<!doctype html>
<!-- 폰으로 보기(1.6, 1.7.1 개편). 정적 한 장 + 프레임워크 없는 JS. Mac 앱(Remote.swift)이 중계 서버(server/brag.py relay/…)에 올린
     상태(RemoteState v2)를 읽어 Mac 띠와 같은 과수원을 그리고, 버튼은 명령을 보낸다. 게임 규칙·가격은 Mac 이 계산해 보낸다.
     옛 앱(v1 상태)이면 과수원 그림·바꿔 심기 없이 숫자만 보인다.
     키는 주소 # 뒤(k=)와 localStorage 에만 둔다. iOS 홈 화면 앱은 저장소가 따로라 주소에 키를 남겨 둔다(그래서 iOS 에는 manifest 를 걸지 않는다).
     그림: sprites/(scripts/m-sprites.py), 글꼴: fonts/(scripts/m-font.py, 갈무리11 SIL OFL). 문구를 바꾸면 m-font.py 를 다시 돌린다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Lemon Desk</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lemon Desk">
<meta name="theme-color" content="#FFF6D8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1D12" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="../icon.png?v=1">
<link rel="icon" href="sprites/icon-64.png">
<link rel="preload" href="fonts/galmuri11-bold.woff2?v=1181" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: "Galmuri"; src: url(fonts/galmuri11-bold.woff2?v=1181) format("woff2"); font-display: swap; }
  :root { --bg: #FFF6D8; --ink: #4A2E14; --soft: #7A5B3A; --page-ink: #4A2E14; --page-soft: #7A5B3A; --leaf: #5E9A12; --track: #E4D3A6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1A1D12; --page-ink: #F4E9C8; --page-soft: #C2B58E; } }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
         word-break: keep-all; padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
  [hidden] { display: none !important; }
  p, h1, h2, h3 { margin: 0; }
  img, .panel, .btn, .tabs, .spr { image-rendering: pixelated; }
  .px { font-family: "Galmuri", -apple-system, "Apple SD Gothic Neo", sans-serif; font-weight: 700; letter-spacing: 0; }
  .num { font-variant-numeric: tabular-nums; }
  :focus-visible { outline: 3px solid #2F6FD0; outline-offset: 2px; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 0 12px calc(96px + env(safe-area-inset-bottom)); }
  .wide .wrap { max-width: none; } /* 확인·캡처용 ?wide: 과수원 전체를 한 화면에 */

  header.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 2px 8px; color: var(--page-ink); }
  .brand { display: inline-flex; align-items: center; gap: 8px; font-size: 16.5px; }
  .brand img { width: 26px; height: 26px; border-radius: 6px; image-rendering: auto; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--page-soft); }
  .chip::before { content: ""; width: 8px; height: 8px; background: #A89A78; }
  .chip.on::before { background: #58B02C; }

  /* 과수원 장면: Mac 띠와 같은 그림·움직임(아트 픽셀 1칸 = 1px, 맥 1pt = 2px). 밭은 손가락으로 옆으로 민다(브라우저 스크롤, 1.12).
     창고·랜턴(.yard)은 왼쪽에 붙어 있고, 하늘(.sky 구름, .sky.front 새)은 화면 기준이라 밀어도 그 자리다. */
  .scene { position: relative; height: 172px; overflow: hidden; border: 3px solid #5B3A1A; background: linear-gradient(#BFE3F2 0 62%, #DDF1F8 62% 100%); }
  .scene.dawn { background: linear-gradient(#F7CDB8 0 62%, #FCE6D6 62% 100%); }
  .scene.dusk { background: linear-gradient(#F3B57E 0 62%, #FADBB0 62% 100%); }
  .scene.night { background: linear-gradient(#141B36 0 62%, #222D55 62% 100%); }
  .pan { position: absolute; inset: 0; z-index: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
  .pan::-webkit-scrollbar { display: none; }
  .sky { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .sky.front { z-index: 1; }
  /* 과수원 밖으로 나간 것이 스크롤 범위를 늘리지 않게. clip 이어야 창고가 붙는다(hidden 은 옛 브라우저용: 창고도 같이 밀린다) */
  .world { position: relative; height: 100%; min-width: 100%; overflow: hidden; overflow: clip; }
  .yard { position: sticky; left: 0; width: 0; height: 100%; z-index: 15; }
  /* 그림은 아래 가운데가 기준점. 시간대·테마 색 보정과 옷 염색은 불러올 때 캔버스로 한 번 입힌다(맥 Sprite.image 처럼) */
  .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 30px; background-repeat: repeat-x; background-position: left bottom; image-rendering: pixelated; }
  .scene .sp, .scene .bd { position: absolute; left: 0; bottom: 0; background-repeat: no-repeat; image-rendering: pixelated; }
  .scene .ent, .scene .lift { position: absolute; left: 0; bottom: 0; width: 0; height: 0; }
  .scene .tl { position: absolute; inset: 0; background-repeat: no-repeat; image-rendering: pixelated; }
  .scene .sh { position: absolute; left: -17px; bottom: -3px; opacity: .35; background-repeat: no-repeat; image-rendering: pixelated; }
  .hint { margin: 6px 2px 0; font-size: 14px; color: var(--page-soft); }

  /* 픽셀 UI 틀(9-slice) */
  .panel { border: 9px solid transparent; border-image: url(sprites/ui-panel.png) 9 fill / 9px stretch; padding: 8px 10px; color: var(--ink); }
  .btn { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; min-height: 48px; padding: 0 6px;
         border: solid transparent; border-width: 9px 10px 11px; border-image: url(sprites/ui-btn-green.png) 9 10 11 fill / 9px 10px 11px stretch;
         background: none; color: #1F3A0A; font-size: 16.5px; line-height: 1.15; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .btn.y { border-image-source: url(sprites/ui-btn-yellow.png); color: #5A3A00; }
  .btn:active:not(:disabled), .btn[aria-busy="true"] { border-width: 9px 10px 9px; border-image: url(sprites/ui-btn-green-down.png) 9 10 9 fill / 9px 10px 9px stretch; transform: translateY(2px); }
  .btn:disabled { border-width: 9px 10px; border-image: url(sprites/ui-btn-off.png) 9 10 fill / 9px 10px stretch; color: #4F4034; cursor: default; }
  .btn small { display: inline-flex; align-items: center; gap: 3px; font-size: 14px; }
  .btn small img { width: 14px; height: 13px; }

  .hud { margin-top: 10px; display: grid; grid-template-columns: 104px 1fr; gap: 4px 14px; align-items: center; }
  .hud .crate { width: 104px; height: 100px; }
  .hud .label { font-size: 16.5px; color: var(--soft); }
  .hud .count { font-size: 33px; line-height: 1.1; }
  .bar { height: 12px; border: 2px solid #5B3A1A; background: var(--track); margin: 6px 0 4px; }
  .bar i { display: block; height: 100%; background: var(--leaf); }
  .hud .full { font-size: 15px; color: var(--soft); }
  .hud .top2 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .coins { display: inline-flex; align-items: center; gap: 5px; font-size: 16.5px; }
  .hud .btn { grid-column: 1 / -1; min-height: 56px; font-size: 22px; margin-top: 6px; flex-direction: row; }
  /* 결과 안내: 어느 탭에서나 보이게 아래 탭 위에 띄운다 */
  .raid-note { margin: 8px 4px 0; padding: 8px 12px; font-size: 14px; font-weight: 600; color: var(--page-ink); background: rgba(201, 138, 46, .14); border-left: 4px solid #C98A2E; }
  .toast { position: fixed; left: 50%; bottom: calc(78px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 6; width: max-content; max-width: calc(100% - 24px);
           margin: 0; padding: 8px 14px; font-size: 15px; font-weight: 600; text-align: center; color: #FFF6D8; background: #4A2E14; border: 2px solid #C98A2E; pointer-events: none; }
  .toast:empty { display: none; }
  .banner { margin-top: 10px; font-size: 15px; display: flex; align-items: center; gap: 10px; }
  .banner p { flex: 1; }
  .week { margin-top: 10px; }
  .week h2, .sec { font-size: 16.5px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 6px; }
  .stats b { display: block; font-size: 22px; font-weight: 700; }
  .stats span, .week .more { font-size: 14px; color: var(--soft); }
  .week .more { margin-top: 6px; }
  .dim { opacity: .55; }

  .sec { margin: 14px 2px 8px; color: var(--page-ink); }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .tile { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; }
  .tile .pic { height: 96px; display: flex; align-items: flex-end; justify-content: center; }
  .tile .pic img { max-height: 96px; }
  .tile.locked .pic img { filter: brightness(0); opacity: .3; }
  .tile b { font-size: 16.5px; font-weight: 700; overflow-wrap: anywhere; }
  .tile .sub, .card .sub { font-size: 14px; color: var(--soft); }
  .tile .trait { font-size: 14px; color: #3F6B0A; }
  .tile .btn { width: 100%; margin-top: auto; }
  .tile .sub { margin-bottom: 6px; }
  .why { font-size: 14px; color: #8A3B12; min-height: 0; }
  .card { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: center; margin-bottom: 10px; }
  .card .who { display: flex; align-items: flex-end; min-width: 60px; justify-content: center; }
  .card .who .spr { background-repeat: no-repeat; }
  .card b { font-size: 16.5px; }
  .card .acts { grid-column: 1 / -1; display: flex; gap: 8px; margin-top: 6px; }
  .card .acts .btn { flex: 1; }

  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center; padding: 0 8px env(safe-area-inset-bottom);
          border: solid transparent; border-width: 6px 8px; border-image: url(sprites/ui-plank.png) 6 8 fill / 6px 8px stretch; }
  .tabs button { flex: 1; min-width: 0; max-width: 160px; min-height: 56px; background: none; border: 0; color: #FFE9B8; font-size: 14px; display: flex; flex-direction: column;
                 align-items: center; justify-content: center; gap: 2px; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .tabs button img { height: 25px; width: auto; }
  .tabs button[aria-selected="true"] { color: #FFD84A; box-shadow: inset 0 -4px 0 #FFD84A; }

  dialog.sheet { margin: auto auto 0; padding: 0; border: 0; background: none; width: 100%; max-width: 480px; }
  dialog.sheet::backdrop { background: rgba(20, 14, 6, .55); }
  .sheet .panel { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
  .plots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 10px 0; max-height: 52vh; overflow-y: auto; } /* 1.12: 칸이 많으면 안에서 스크롤 */
  .plots button { background: none; border: 2px solid #C9A56B; padding: 2px 0 0; min-height: 76px; font-size: 14px; color: var(--ink); cursor: pointer; }
  .plots button img { width: 62px; height: 55px; display: block; margin: 0 auto; }
  .plots button:disabled { opacity: .4; }

  /* 1.14: 땅·꾸미기·밭 지도·옷 색·이웃·모음 */
  .panel + .panel, #farm > .panel { margin-top: 10px; }
  .panel > b.px { display: block; font-size: 16.5px; }
  .note { font-size: 14px; color: var(--soft); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  .row > .btn { flex: 1 1 0; min-width: 0; }
  .row > .field { flex: 2 1 140px; }
  .field { min-width: 0; min-height: 48px; font: inherit; font-size: 16px; padding: 6px 10px; border: 2px solid #C9A56B; border-radius: 0; background: #FFFDF3; color: #4A2E14; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .seg button { flex: 1 1 0; min-width: 56px; min-height: 44px; padding: 4px 6px; border: 2px solid #C9A56B; background: #FFFDF3; color: #4A2E14; font: inherit; font-size: 14px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: #FFD84A; border-color: #5B3A1A; font-weight: 700; }
  .seg button:disabled { opacity: .45; cursor: default; }
  .seg button img { height: 22px; width: auto; vertical-align: middle; }
  .seg.list button { flex-basis: 100%; text-align: left; padding: 8px 10px; }
  .seg.list button:disabled { opacity: .7; }
  .seg.list span { display: block; font-size: 13px; font-weight: 400; color: var(--soft); }
  .seg.list span.got { color: #4A2E14; font-weight: 700; }
  .seg .sw { flex: 1 1 0; min-width: 0; max-width: 52px; }
  .prop { display: grid; grid-template-columns: 1fr; gap: 0; margin-top: 10px; font-size: 15px; }
  .mini { display: flex; align-items: flex-end; height: 40px; margin: 4px 0; overflow: hidden; }
  .mini img { height: 38px; width: auto; margin-right: -14px; }
  .tag { display: inline-block; margin-left: 6px; padding: 0 6px; font-size: 13px; background: #E4F2C8; color: #2F5208; vertical-align: 2px; }
  .icons { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .icons img { width: 24px; height: 22px; }
  .off img, img.off { filter: brightness(0); opacity: .25; }
  .dex { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 4px; margin-top: 8px; text-align: center; font-size: 13px; line-height: 1.25; }
  .dex img { width: 48px; height: 43px; display: block; margin: 0 auto 2px; }
  .goal { margin-top: 8px; font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; font-size: 13px; }
  .chips span { padding: 1px 6px; background: #E4F2C8; color: #2F5208; }
  .goal .bar { height: 8px; margin: 2px 0 0; }
  .goal.done { color: var(--soft); }
  .plots > div { border: 2px solid #C9A56B; padding: 2px 0 0; min-height: 76px; font-size: 14px; text-align: center; }
  .plots > div img { width: 62px; height: 55px; display: block; margin: 0 auto; }
  #map { grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); margin: 0; }
  #map img { width: 100%; max-width: 62px; height: auto; }
  .plots.list { grid-template-columns: 1fr; }
  .plots.list button { min-height: 52px; font-size: 16px; display: flex; align-items: center; gap: 10px; padding: 4px 10px; text-align: left; }
  .plots.list button img { width: auto; height: 32px; margin: 0; }
  .party { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 20; }
  .party .panel { width: 220px; text-align: center; animation: pop 2.6s ease-out forwards; }
  .party b { display: block; font-size: 16.5px; margin-bottom: 6px; }
  .party span { display: block; margin-top: 6px; font-size: 16.5px; }
  @keyframes pop { 0% { transform: translateY(40vh) scale(.3); opacity: 0 } 18% { transform: none; opacity: 1 } 80% { opacity: 1 } 100% { opacity: 0 } }
  .fly { position: fixed; z-index: 15; width: 18px; height: 16px; pointer-events: none; }

  /* 1.15 날씨(흐린 하늘·비·눈·바람 잎·무지개)와 가판대·주문 */
  .scene.grey { background: linear-gradient(#AFC2CB 0 62%, #CFDCE1 62% 100%); }
  .scene .rainbow { position: absolute; bottom: 30px; width: 300px; height: 150px; border-radius: 150px 150px 0 0; opacity: .5;
    background: radial-gradient(circle at 50% 100%, transparent 0 102px, #9B6FD0 102px 108px, #4F86E0 108px 114px, #4FB06A 114px 120px, #F2D23C 120px 126px, #F29A3A 126px 132px, #E2574C 132px 138px, transparent 138px); }
  .good { width: 22px; height: 22px; vertical-align: -5px; margin-right: 4px; }
  .prop .row { margin-top: 4px; flex-wrap: nowrap; }
  .seg + .note { margin-top: 10px; }
  .prop .grow { flex: 2 1 0; min-width: 0; }
  .prop .grow + .btn { flex: 0 0 112px; }
  .gate { margin-top: 12px; text-align: center; }
  .gate h1 { font-size: 22px; margin: 6px 0; }
  .gate ol { text-align: left; margin: 10px 0 0; padding-left: 1.3em; }
  footer { margin-top: 20px; font-size: 14px; color: var(--page-soft); text-align: center; }
  footer a { color: inherit; }
  @media (prefers-reduced-motion: reduce) {
    .party .panel { animation: fadeonly 2.6s forwards; }
    @keyframes fadeonly { 0%, 100% { opacity: 0 } 10%, 80% { opacity: 1 } }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="brand px"><img src="sprites/icon-64.png" alt="" width="26" height="26">Lemon Desk</span>
    <span class="chip" id="chip" hidden></span>
  </header>

  <main id="app" hidden>
    <section id="tab-orchard" role="tabpanel" aria-labelledby="t-orchard">
      <div class="scene" id="scene"><div class="sky" id="sky"></div><div class="pan" id="pan" role="group" tabindex="0" aria-label="과수원"><div class="world" id="world"><div class="ground"></div><div class="yard" id="yard"></div></div></div><div class="sky front" id="sky2"></div></div>
      <p class="hint num" id="clear" hidden></p>
      <p class="hint" id="seedling" hidden></p>
      <p class="hint" id="hint" hidden></p>
      <div class="panel hud">
        <img class="crate" id="crate-pic" src="sprites/crate-0.png" alt="" width="104" height="100">
        <div>
          <div class="top2"><span class="label px" data-t="crate">창고</span>
            <span class="coins px num"><img src="sprites/coin.png" alt="" width="18" height="16"><span id="coins">0</span></span></div>
          <div class="count px num" id="count">0 / 0</div>
          <div class="bar" aria-hidden="true"><i id="bar" style="width:0"></i></div>
          <div class="full num" id="full"></div>
        </div>
        <button class="btn px" id="sell" type="button" data-t="sell">모두 팔기</button>
      </div>
      <div id="suggest"></div>
      <div id="farm"></div>
      <div id="stand"></div>
      <p class="raid-note" id="raid-note" role="status" hidden></p>
      <div class="panel banner" id="banner" hidden><p id="banner-text"></p><button class="btn y px" id="retry" type="button" hidden></button></div>
      <div class="panel week" id="week" hidden>
        <h2 class="px" data-t="week">이번 주</h2>
        <div class="stats">
          <div><b class="px num" id="w-h">0</b><span data-t="picked">딴 레몬</span></div>
          <div><b class="px num" id="w-s">0</b><span data-t="soldN">판 레몬</span></div>
          <div><b class="px num" id="w-e">0</b><span data-t="earned">번 코인</span></div>
        </div>
        <p class="more num" id="w-more"></p>
      </div>
      <div id="deco-sec" hidden><h2 class="sec px" data-t="decoH">꾸미기</h2><div id="deco"></div></div>
    </section>

    <section id="tab-plant" role="tabpanel" aria-labelledby="t-plant" hidden>
      <h2 class="sec px" id="field"></h2>
      <div class="grid" id="kinds"></div>
      <div id="map-sec" hidden><h2 class="sec px" data-t="mapH">밭 지도</h2><div class="panel"><div class="plots" id="map"></div></div></div>
    </section>

    <section id="tab-crew" role="tabpanel" aria-labelledby="t-crew" hidden>
      <h2 class="sec px" data-t="crew">일꾼</h2>
      <div id="crew"></div>
      <h2 class="sec px" data-t="mgrH">매니저</h2>
      <div id="mgr"></div>
      <h2 class="sec px" data-t="crateUp">창고 넓히기</h2>
      <div id="crate"></div>
    </section>

    <section id="tab-nb" role="tabpanel" aria-labelledby="t-nb" hidden>
      <p class="panel" id="nb-old" hidden></p>
      <div id="nb-main">
        <div id="nb-req"></div>
        <h2 class="sec px" data-t="myFarm">내 과수원</h2>
        <div class="panel">
          <b class="px" id="my-name"></b>
          <p class="note num" id="my-thanks"></p>
          <div class="row"><input class="field" id="name-in" maxlength="20" autocomplete="off" aria-label="과수원 이름"><button class="btn y px" id="name-go" type="button" data-t="rename">이름 바꾸기</button></div>

      px[i] = r; px[i + 1] = gg; px[i + 2] = b;
    }
    x.putImageData(d, 0, 0);
    return new Promise(ok => c.toBlob(bl => ok(bl ? URL.createObjectURL(bl) : c.toDataURL())));
  }
  /** 그림 주소(불러온 뒤에 돌려줘서 바꿔 끼울 때 빈 칸이 안 보인다). dye: 색상(도), lit: 빛나는 것(랜턴·감정 표시)은 보정하지 않는다 */
  function art(name, dye = null, lit = false) {
    const url = S + name + '.png' + V, colors = dye != null && index[name] ? index[name][3] : null, g = lit ? null : tint;
    if (!g && !colors) return load(url).then(() => url, () => url);
    const key = `${name}|${colors ? dye : '-'}|${g ? tintKey : '-'}`;
    if (!looks.has(key)) looks.set(key, load(url).then(im => recolor(im, colors, dye, g)).catch(() => url));
    return looks.get(key);
  }
  /** 그림(또는 시트)을 요소에 건다. clip 이 있으면 프레임을 넘긴다(맥 CAKeyframeAnimation contents, discrete).
   *  once: 한 번 재생하고 마지막 프레임에 머문다, frame: 멈춘 그림의 프레임, offset: 되풀이의 시작 시각(초) */
  function show(e, name, {clip = null, once = false, frame = 0, offset = 0, dye = null, lit = false, center = true} = {}) {
    const info = index[name]; if (!info) return;
    const tok = e.tok = (e.tok || 0) + 1, [w, h, n] = info;
    art(name, dye, lit).then(u => {
      if (e.tok !== tok) return;
      if (e.frames) { e.frames.cancel(); e.frames = null; }
      Object.assign(e.style, {width: w + 'px', height: h + 'px', backgroundImage: `url("${u}")`, backgroundPosition: `${-(once ? n - 1 : frame) * w}px 0`});
      if (center) e.style.marginLeft = -w / 2 + 'px';
      if (!clip || n < 2 || calm) return;
      const kf = [], kt = clip.keyTimes;
      for (let i = 0; i < n; i++) kf.push({backgroundPosition: `${-i * w}px 0`, offset: kt[i], easing: 'steps(1, end)'});
      kf.push({backgroundPosition: `${-(n - 1) * w}px 0`, offset: 1});
      e.frames = e.animate(kf, {duration: clip.duration * 1000, iterations: once ? 1 : Infinity});

  const frames = name => index[name] ? index[name][2] : 0;
  const loop = (e, name, perFrame, opt = {}) => show(e, name, {...opt, clip: Motion.even(frames(name), perFrame)});
  // 장면 요소: 고정된 것은 left/bottom, 움직이는 것은 빈 그릇(ent, transform 으로 옮김) 안의 몸(bd). host: 밭(world)·창고 자리(yard)·하늘(sky, sky2)
  function sp(z, x, y, cls, host = world) { const e = el('div', 'sp' + (cls ? ' ' + cls : '')); Object.assign(e.style, {zIndex: z, left: x + 'px', bottom: y + 'px'}); host.append(e); return e; }
  function ent(z, y, host = world) { const e = el('div', 'ent'), lift = el('div', 'lift'), body = el('div', 'bd'); lift.append(body); e.append(lift); Object.assign(e.style, {zIndex: z, bottom: y + 'px'}); host.append(e); return {el: e, lift, body}; }
  const atX = e => { const m = getComputedStyle(e).transform; return m && m !== 'none' ? Math.round(new DOMMatrixReadOnly(m).m41) : 0; };
  /** 1px(0.5pt)씩 끊어 옮긴다(맥 position.x discrete). times: Motion.walkTimes(초). 걸린 시간(초)을 돌려준다 */
  function walk(e, from, to, times) {
    const dir = to > from ? 1 : -1, total = times[times.length - 1], kf = [];
    for (let k = 0; k < times.length - 1; k++) kf.push({transform: `translateX(${from + dir * k}px)`, offset: times[k] / total, easing: 'steps(1, end)'});
    kf.push({transform: `translateX(${to}px)`, offset: 1});
    if (e.move) e.move.cancel();
    e.style.transform = `translateX(${to}px)`;
    e.move = e.animate(kf, {duration: total * 1000});
    return total;
  }
  /** 일정한 빠르기로 흘러가며 양 끝에서 나타났다 사라진다(맥 drift). 걸린 시간(초) */
  function drift(e, from, to, speed, opacity = 1) {
    const dist = Math.abs(to - from), ms = dist / speed * 1000;
    e.style.transform = `translateX(${to}px)`; e.style.opacity = 0;
    e.animate([{transform: `translateX(${from}px)`}, {transform: `translateX(${to}px)`}], {duration: ms, easing: `steps(${Math.max(1, Math.round(dist))}, end)`});
    e.animate([{opacity: 0}, {opacity, offset: .06}, {opacity, offset: .94}, {opacity: 0}], {duration: ms});
    return ms / 1000;
  }
  const discrete = (values, prop, fmt) => values.map((v, i) => ({[prop]: fmt(v), offset: i / values.length, easing: 'steps(1, end)'})).concat({[prop]: fmt(values[values.length - 1]), offset: 1});
  const later = (s, f) => setTimeout(f, s * 1000);
  const resting = () => scene.hidden || $('tab-orchard').hidden || document.visibilityState !== 'visible'; // 안 보이면 장면도 쉰다

  // ── 효과·세상의 반응 ─────────────────────────────
  function puff(name, x, y, perFrame = 0.1, lit = false) { // 한 번 재생하고 사라진다
    const n = frames(name); if (calm || !n || scene.hidden) return;
    const e = sp(30, x, y); show(e, name, {clip: Motion.even(n, perFrame, false), once: true, lit});
    later(n * perFrame + 0.05, () => e.remove());
  }
  function shake(i) { // 일꾼이 건드린 나무가 1px 씩 떨리고, 다 큰 나무는 흔들림 그림이 잠깐 보인다
    const t = trees[i]; if (calm || !t) return;
    t.el.animate(discrete([1, -1, 1, 0], 'transform', v => `translateX(${v}px)`), {duration: 280});
    if (t.swayable) { t.a.animate([{opacity: 0, easing: 'steps(1, end)'}, {opacity: 1, offset: .7}, {opacity: 1}], {duration: 300}); t.b.animate([{opacity: 1, easing: 'steps(1, end)'}, {opacity: 0, offset: .7}, {opacity: 0}], {duration: 300}); }
  }
  function bumpCrate() { if (!calm && crateEl) crateEl.animate(discrete([1, -2, -1, 0], 'transform', v => `translateY(${v}px)`), {duration: 240}); }
  function hop(w, values = [0, -10, -12, -6, 0], ms = 400) {
    if (calm) return;
    const base = -(w.liftPx || 0);
    w.lift.animate(discrete(values.map(v => v + base), 'transform', v => `translateY(${v}px)`), {duration: ms});
  }
  function emote(name, host, hold = 1.1) { // 머리 위 감정 표시. 톡 튀어나와 잠깐 머문다(일꾼·개를 따라 움직인다)
    const n = 'emote-' + name; if (calm || !index[n] || !host.h) return;
    const e = el('div', 'bd emo'); e.style.bottom = host.h() + 'px'; e.style.left = '10px'; e.style.zIndex = 5; host.lift.append(e);
    show(e, n, {lit: true});
    e.animate(discrete([6, -4, 0], 'transform', v => `translateY(${v}px)`), {duration: 180});
    later(hold, () => e.remove());
  }
  function dropFruit(i, w) { // 딴 열매가 나무에서 일꾼 바구니로
    const p = state().plots[i], name = p && 'fruit-' + p.kind; if (calm || !p || !index[name]) return;
    const ex = w.x + 12, ey = WORKER_Y + 20, e = sp(30, ex, ey); show(e, name);
    e.animate([{transform: `translate(${plotX(i) - 12 - ex}px, ${ey - (TREE_Y + 68)}px)`}, {transform: 'translate(0, 0)'}], {duration: 220, easing: 'ease-in'});
    later(0.22, () => e.remove());
  }
  function celebrate(w) { // 장비 단계가 오르면 반짝이며 깡충
    if (calm) return;
    for (let k = 0; k < 3; k++) later(k * 0.25, () => puff('fx-sparkle', w.x + Math.round(rnd(-20, 20)), WORKER_Y + w.h() - k * 12));
    hop(w, [0, -12, 0, -8, 0], 600);
  }
  function coinBurst() { // 팔면 창고에서 동전이 튄다
    const n = frames('fx-coin'); if (calm || !n || !crateEl) return;
    for (let k = 0; k < 6; k++) {
      const x = view().l + CRATE_X + Math.round(rnd(-20, 20)), e = sp(30, x, 58); loop(e, 'fx-coin', 0.06);
      e.animate([{transform: 'translate(0, 0)', opacity: 1}, {opacity: 1, offset: .75}, {transform: `translate(${Math.round(rnd(-28, 28))}px, -60px)`, opacity: 0}], {duration: 900, delay: k * 70, fill: 'both'});
      later(1.4, () => e.remove());
    }
  }
  function sold() { // 맥 1.7·1.8.4: 다 같이 폴짝, 두 명쯤은 머리 위에 반짝
    coinBurst();
    for (const w of crew.values()) hop(w);
    [...crew.values()].sort(() => Math.random() - .5).slice(0, 2).forEach(w => emote('star', w));
  }

  // ── 일꾼(맥 Worker): 계획(단계 목록)을 하나씩 실행한다 ─────────────────────────────
  class Worker {
    constructor(v, x) {
      Object.assign(this, v, {x, facing: 1, steps: [], token: 0, playing: '', sheetName: '', once: false, last: null, lastTree: null, streak: 0, sitLift: 0, liftPx: 0});
      this.speed = Motion.speed(this.role, this.slot);
      const e = ent(20 + ROLES.indexOf(this.role) * 2 + this.slot, WORKER_Y, this.host || world);
      Object.assign(this, e);
      this.sh = el('div', 'sh'); this.lift.prepend(this.sh); show(this.sh, 'fx-shadow-0', {center: false});
      this.el.style.transform = `translateX(${x}px)`;
      this.play('idle');
      for (const a of ['walk', ...Motion.workAnims(this.role, true), ...Motion.workAnims(this.role, false), 'carry']) if (index[this.sheet(a)]) art(this.sheet(a), this.hue()); // 미리 받아 둔다
    }
    hue() { return DYE_HUES[this.dye] ?? null; }
    h() { return (index[this.sheetName] || [0, 64])[1]; }
    /** 동작 → 시트 이름. 이 캐릭터·장비 단계 그림이 없으면 낮은 단계, 그다음 기본 캐릭터로(맥 Worker.sheet) */
    sheet(anim) {
      for (const v of this.variant ? ['b', ''] : ['']) for (let t = this.tier; t >= 0; t--) { const n = `w-${this.role}${v}-${t}-${anim}`; if (index[n]) return n; }

    }
    owns(anim) { return !!index[`w-${this.role}${this.variant ? 'b' : ''}-${this.tier}-${anim}`]; }
    standing() { return !(this.el.move && this.el.move.playState === 'running'); }
    remember(c) { this.last = c; if (c.kind === 'work') { this.streak++; this.lastTree = c.tree; } else this.streak = 0; }
    face(dir) { this.facing = dir; this.body.style.transform = `scaleX(${dir})`; }
    look(px) { if (Math.abs(px - this.x) > 2) this.face(px > this.x ? 1 : -1); }

    }
    reload() { const a = this.playing || 'idle'; this.sheetName = ''; this.play(a); }
    update(v) { // 외모·장비 단계가 바뀌면 지금 동작을 새 시트로. 단계가 올랐으면 true
      if (v.variant === this.variant && v.tier === this.tier && v.dye === this.dye) return false;

      if (this.el.move) { this.x = atX(this.el); this.el.move.cancel(); this.el.move = null; this.el.style.transform = `translateX(${this.x}px)`; }

        const target = Math.round(typeof st.x === 'function' ? st.x() : st.x), dist = Math.abs(target - this.x); // 함수: 걷기 시작할 때 자리(화면에 붙은 창고)
        if (dist < 1) return this.next();

        if (dir !== this.facing && dist > 8) { this.steps.unshift(st); this.play('idle'); this.face(dir); return this.wait(0.14); } // 돌아설 때 한 박자
        this.face(dir); this.play(st.anim);
        const s = walk(this.el, this.x, target, Motion.walkTimes(dist / 2, this.speed));
        this.x = target; return this.wait(s);
      }
      if (st.t === 'act') { if (TOWARD.has(st.anim)) this.face(1); this.setLift(st.anim === 'sit' ? this.sitLift : 0); this.play(st.anim); return this.wait(st.secs); }
      if (st.t === 'clip') {

  }

  // 1.15 도담: 창고와 가판대 사이에 서 있다가 가끔 클립보드를 보고(버릇), 창고가 차서 팔면 상자를 들고 와 종을 울린다(코인 튐).
  // 창고 자리(yard)에 있어 밭을 밀어도 창고 옆이다. 장비 단계·옷 색 없음
  class Manager extends Worker {
    constructor(x) { super({role: 'manager', slot: 0, variant: 0, tier: 0, dye: 0, host: yard, planner: managerPlan}, x); }
    sheet(anim) { return 'manager-' + anim; }
    owns(anim) { return !!index['manager-' + anim]; }
  }
  // 맥 OrchardView 와 같은 자리(1pt = 2px): 가판대 originX+76pt, 도담 +106pt(가판대 없으면 +64pt), 랜턴은 가판대·도담이 있으면 +4pt
  const STAND_X = O + 152, mgrX = () => stand ? O + 212 : O + 128;
  function managerPlan(m) {
    if (quiet || calm || resting()) return [idle(4)];
    if (Math.abs(m.x - mgrX()) > 2) return [{t: 'walk', x: mgrX(), anim: 'walk'}, {t: 'run', f: () => m.face(1)}, idle(1)];
    return Math.random() < 0.3 && m.owns('habit') ? [rest(m, 'habit'), idle(rnd(4, 8))] : [idle(rnd(5, 10))];
  }
  function managerSells() { // 창고 → 상자 들고 제자리 → 종 두 번 + 코인
    if (!mgr || calm || quiet || resting()) return;
    const bell = {t: 'clip', anim: 'sell'};
    mgr.interrupt([{t: 'walk', x: CRATE_X + 34, anim: 'walk'}, {t: 'run', f: bumpCrate}, {t: 'walk', x: mgrX(), anim: mgr.owns('carry') ? 'carry' : 'walk'},
      {t: 'run', f: () => { mgr.face(1); coinBurst(); emote('note', mgr); }}, bell, bell, idle(2)]);
  }

  // 할 일이 끝난 일꾼이 다음에 할 일(맥 OrchardView.plan·steps). 무엇을 할지는 Motion.choose
  const idle = secs => ({t: 'act', anim: 'idle', secs});
  const rest = (w, anim) => Motion.clip(anim, frames(w.sheet(anim))).loops ? {t: 'act', anim, secs: 1.44} : {t: 'clip', anim};
  const dig = i => ({t: 'clip', anim: 'dig', cues: {hit: () => { puff('fx-dust', plotX(i) - 20, TREE_Y); shake(i); }, toss: () => puff('fx-dust', plotX(i) - 12, TREE_Y, 0.06)}});
  function plan(w) {
    const s = state();
    if (quiet || calm || resting() || !s || !s.plots || !s.plots.length) return [idle(4)];
    const land = landOf(s), digger = crew.get('planter-0') || crew.get('planter-1') || crew.get('caretaker-0') || crew.get('harvester-0');
    const job = s.clearing > 0 && w === digger && Math.random() < 0.45 && ['dig', 'tamp', 'water'].find(a => index[w.sheet(a)]);
    if (job) { // 1.12 개간 중(맥 clearWork): 끝 칸이 보이면 한 일꾼이 가끔 가서 삽질·다지기·물 주기
      const [a, b] = plotsIn(0, land + 1);
      if (land >= a && land <= b) return [{t: 'walk', x: plotX(land) - (job === 'water' ? 44 : 40), anim: 'walk'},
        ...Array(1 + Math.floor(Math.random() * 2)).fill(job === 'dig' ? dig(land) : {t: 'clip', anim: job}), idle(rnd(1, 3))];
    }
    if (w.slot === 0 && staffOf(w.role) === 2 && Math.random() < 0.06) { const mine = meetUp(w); if (mine) return mine; }
    const hello = greet(w); if (hello) return hello;
    const has = new Set(['dig', 'water', 'pick'].filter(a => index[w.sheet(a)]).concat(['seed', 'tamp', 'wipe', 'wave', 'yawn', 'sniff', 'habit', 'sit'].filter(a => w.owns(a))));
    // 1.12: 보이는 칸 ± 1칸에서만 고른다(Motion.choose 는 그대로, 칸 번호만 구간 기준으로 바꿔 넘긴다)
    const [a, b] = plotsIn(1, s.plots.length), near = s.plots.slice(a, b + 1), rel = c => c && c.tree != null ? {...c, tree: c.tree - a} : c;
    const c = Motion.choose({role: w.role, fruit: near.map(p => p.fruit), young: near.map(p => p.stage < 3), crateFull: moment().crate >= s.crate.capacity,
      night: period === 'night', season: s.season, streak: w.streak, last: rel(w.last), lastTree: w.lastTree == null ? null : w.lastTree - a, has, rain: wx.now === 'rain'});
    if (c.tree != null) c.tree += a;
    w.remember(c);
    switch (c.kind) {
      case 'work':
        if (c.anim === 'pick') return [{t: 'walk', x: plotX(c.tree) - 28, anim: 'walk'}, {t: 'clip', anim: 'pick', cues: {pluck: () => { shake(c.tree); dropFruit(c.tree, w); }}},
          {t: 'walk', x: () => view().l + CRATE_X + 36, anim: 'carry'}, {t: 'run', f: () => { puff('fx-sparkle', view().l + CRATE_X, 58); bumpCrate(); }}, idle(0.6)];
        if (c.anim === 'water') return [{t: 'walk', x: plotX(c.tree) - 44, anim: 'walk'},
          ...Array(c.reps).fill({t: 'clip', anim: 'water', cues: {pour: () => { puff('fx-water', plotX(c.tree) - 8, TREE_Y + 4); shake(c.tree); }}}), idle(rnd(1.5, 4))];
        if (c.anim === 'dig') return [{t: 'walk', x: plotX(c.tree) - 40, anim: 'walk'}, ...Array(c.reps).fill(dig(c.tree)), idle(rnd(1, 3))];
        if (c.anim === 'seed') return [{t: 'walk', x: plotX(c.tree) - 40, anim: 'walk'}, {t: 'clip', anim: 'seed', cues: {drop: () => puff('fx-sparkle', plotX(c.tree) - 20, TREE_Y - 4)}}, idle(rnd(1, 2.5))];
        return [{t: 'walk', x: plotX(c.tree) - 40, anim: 'walk'}, {t: 'clip', anim: c.anim, cues: {pat: () => { puff('fx-dust', plotX(c.tree) - 20, TREE_Y, 0.07); shake(c.tree); }}}, idle(rnd(1, 2.5))];
      case 'rest':

    if (s && s.week) {
      $('w-h').textContent = short(s.week.harvested); $('w-s').textContent = short(s.week.sold); $('w-e').textContent = short(s.week.earned);
      $('w-more').textContent = [T.seasons[s.season], s.dex != null && s.secrets != null ? T.dex(s.dex, s.secrets) : ''].filter(Boolean).join(' · ');
    }
    renderScene(); renderPlant(); renderCrew(); renderMgr(); renderSuggest(); renderFarm(); renderStand(); renderDeco(); renderMap(); renderNb(); renderRaid(); renderCol(); tick();
  }

  let timer;
  function accept(d) {
    offset = d.now * 1000 - Date.now(); data = d; failed = false; stale = false; seenAt = Date.now();
    if (d.state) try { localStorage.setItem('ld-remote-last', JSON.stringify({d, at: seenAt})); } catch (e) {}
  }
  async function refresh() {
    clearTimeout(timer);
    try { accept(await api('view')); } catch (e) {
      if (e.status === 401) { localStorage.removeItem('ld-remote'); localStorage.removeItem('ld-remote-last'); history.replaceState(null, '', location.pathname); gate(T.lost, T.lostText, null, 'prop-sign-0'); return; }
      failed = true;
    }
    if (data) render(); else { $('app').hidden = false; $('chip').hidden = false; $('chip').textContent = T.offline; $('banner').hidden = false; $('banner-text').textContent = T.offlineText; $('retry').hidden = false; }
    if (document.visibilityState === 'visible') timer = setTimeout(refresh, pending.size ? 1000 : 5000);
  }
  // 명령: 서버가 Mac 의 처리 결과를 최대 3초 기다렸다가 새 상태와 함께 돌려준다. 그 전에 화면은 먼저 바꿔 둔다.
  async function send(cmd, btn) {
    const id = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(16) + Math.random().toString(16).slice(2)).slice(0, 40);
    if (btn) { btn.disabled = true; btn.setAttribute('aria-busy', 'true'); }
    if (navigator.vibrate) navigator.vibrate(12);
    pending.set(id, {...cmd, at: Date.now()});
    try {
      const d = await api('command', {method: 'POST', body: JSON.stringify({id, ...cmd, value: undefined})});
      if (d.now) accept(d);
      if (d.discover) found = d.discover;
      if (d.queued) { // 1.14: Mac 이 잠들어 서버에 예약됐다. 결과는 Mac 이 깨어 반영한 뒤에 온다
        pending.delete(id); const q = queuedMap(); q[id] = {...cmd, at: Date.now()}; saveQueued(q);
        if (cmd.action === 'sell' && override) { override.until = Infinity; override.sent = state()?.sent; }
        toast(cmd.action === 'sell' && cmd.value ? T.queuedSell(short(cmd.value)) : T.queued);
      } else if (d.result) settle(d.result); // 이웃 일은 Mac 이 잠들어도 서버가 바로 처리한다
    } catch (e) {
      pending.delete(id); override = null;
      toast(e.status === 409 ? (/^raid_/.test(cmd.action) ? T.raidAwake : T.asleep('')) : e.status === 429 ? T.tooMany : T.why[e.message] || T.failed);
    }
    if (data) render(); // 결과를 받은 버튼은 render 가 다시 풀어 준다
    clearTimeout(timer); timer = setTimeout(refresh, pending.size ? 1000 : 5000);
  }
  $('sell').onclick = () => {
    const s = state(), m = moment();
    override = {crate: 0, coins: s.coins + m.value, until: Date.now() + 5000};
    flyCoins(); tick();
    send({action: 'sell', value: m.value}, $('sell')); // value 는 예약됐을 때 안내용(서버는 action 만 본다)
  };
  $('retry').onclick = refresh;

  // 탭
  const tabs = ['orchard', 'plant', 'crew', 'nb', 'col'];
  const showTab = name => tabs.forEach(t => { $('tab-' + t).hidden = t !== name; $('t-' + t).setAttribute('aria-selected', t === name); });
  tabs.forEach(t => { $('t-' + t).onclick = () => { showTab(t); scrollTo(0, 0); if (t === 'orchard' && data && index) renderScene(); }; }); // 숨어 있던 장면은 보이는 칸을 그때 그린다
  const startTab = new URLSearchParams(location.search).get('tab'); // 확인·캡처용 ?tab=plant|crew|nb|col
  if (tabs.includes(startTab)) showTab(startTab);

  // 마지막으로 본 과수원을 바로 그린다(서버가 Mac 을 기다리는 동안 빈 화면이 없게). 타임라인이 있어 숫자는 계속 흐른다.
  try {
    const last = JSON.parse(localStorage.getItem('ld-remote-last') || 'null');
    if (last && last.d && last.d.state) { data = last.d; seenAt = last.at; stale = true; offset = 0; render(); }
  } catch (e) {}
  if (!data) { $('app').hidden = false; $('tabs').hidden = false; $('chip').hidden = false; $('chip').textContent = T.connecting; tick(); }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });
  addEventListener('online', refresh);
  setInterval(() => { if (document.visibilityState === 'visible') { tick(); syncSky(); } }, 1000);
  refresh();
})();
</script>
</body>
</html>
