<!doctype html>
<!-- 폰으로 보기(1.6, 1.7.1 개편). 정적 한 장 + 프레임워크 없는 JS. Mac 앱(Remote.swift)이 중계 서버(server/brag.py relay/…)에 올린
     상태(RemoteState v2)를 읽어 Mac 띠와 같은 과수원을 그리고, 버튼은 명령을 보낸다. 게임 규칙·가격은 Mac 이 계산해 보낸다.
     옛 앱(v1 상태)이면 과수원 그림·바꿔 심기 없이 숫자만 보인다.
     키는 주소 # 뒤(k=)와 localStorage 에만 둔다. iOS 홈 화면 앱은 저장소가 따로라 주소에 키를 남겨 둔다(그래서 iOS 에는 manifest 를 걸지 않는다).
     그림: sprites/(scripts/m-sprites.py), 글꼴: fonts/(scripts/m-font.py, 갈무리11 SIL OFL). 문구를 바꾸면 m-font.py 를 다시 돌린다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Lemon Desk</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lemon Desk">
<meta name="theme-color" content="#FFF6D8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1D12" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="../icon.png?v=1">
<link rel="icon" href="sprites/icon-64.png">
<link rel="preload" href="fonts/galmuri11-bold.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: "Galmuri"; src: url(fonts/galmuri11-bold.woff2) format("woff2"); font-display: swap; }
  :root { --bg: #FFF6D8; --ink: #4A2E14; --soft: #7A5B3A; --page-ink: #4A2E14; --page-soft: #7A5B3A; --leaf: #5E9A12; --track: #E4D3A6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1A1D12; --page-ink: #F4E9C8; --page-soft: #C2B58E; } }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
         word-break: keep-all; padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
  [hidden] { display: none !important; }
  p, h1, h2, h3 { margin: 0; }
  img, .panel, .btn, .tabs, .spr { image-rendering: pixelated; }
  .px { font-family: "Galmuri", -apple-system, "Apple SD Gothic Neo", sans-serif; font-weight: 700; letter-spacing: 0; }
  .num { font-variant-numeric: tabular-nums; }
  :focus-visible { outline: 3px solid #2F6FD0; outline-offset: 2px; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 0 12px calc(96px + env(safe-area-inset-bottom)); }

  header.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 2px 8px; color: var(--page-ink); }
  .brand { display: inline-flex; align-items: center; gap: 8px; font-size: 16.5px; }
  .brand img { width: 26px; height: 26px; border-radius: 6px; image-rendering: auto; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--page-soft); }
  .chip::before { content: ""; width: 8px; height: 8px; background: #A89A78; }
  .chip.on::before { background: #58B02C; }

  /* 과수원 장면: Mac 띠와 같은 그림(아트 픽셀 1칸 = 1px). 옆으로 밀어 본다. */
  .scene { position: relative; height: 172px; overflow-x: auto; overflow-y: hidden; border: 3px solid #5B3A1A; scrollbar-width: none;
           background: linear-gradient(#BFE3F2 0 62%, #DDF1F8 62% 100%); -webkit-overflow-scrolling: touch; }
  .scene::-webkit-scrollbar { display: none; }
  .scene.dawn { background: linear-gradient(#F7CDB8 0 62%, #FCE6D6 62% 100%); }
  .scene.dusk { background: linear-gradient(#F3B57E 0 62%, #FADBB0 62% 100%); }
  .scene.night { background: linear-gradient(#141B36 0 62%, #222D55 62% 100%); }
  .world { position: relative; height: 100%; min-width: 100%; }
  .scene.night .world > * { filter: brightness(.72) saturate(.85); }
  .scene.night .world > .lit { filter: none; }
  .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 30px; background: url(sprites/ground-0.png) repeat-x left bottom; }
  .world img { position: absolute; transform: translateX(-50%); }
  .w { position: absolute; bottom: 4px; transform: translateX(-50%); transition: left linear; }
  .w .spr { background-repeat: no-repeat; animation: play var(--dur, 1.5s) steps(var(--n, 8)) infinite; }
  .w .sh { position: absolute; left: 50%; bottom: -3px; width: 34px; height: 10px; margin-left: -17px; background: url(sprites/fx-shadow-0.png); opacity: .35; }
  .w .zzz { position: absolute; left: 60%; bottom: 100%; width: 44px; height: 24px; background: url(sprites/fx-zzz.png); animation: zz 1.6s steps(4) infinite; }
  @keyframes play { to { background-position-x: var(--end); } }
  @keyframes zz { to { background-position-x: -176px; } }
  .hint { margin: 6px 2px 0; font-size: 14px; color: var(--page-soft); }

  /* 픽셀 UI 틀(9-slice) */
  .panel { border: 9px solid transparent; border-image: url(sprites/ui-panel.png) 9 fill / 9px stretch; padding: 8px 10px; color: var(--ink); }
  .btn { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; min-height: 48px; padding: 0 6px;
         border: solid transparent; border-width: 9px 10px 11px; border-image: url(sprites/ui-btn-green.png) 9 10 11 fill / 9px 10px 11px stretch;
         background: none; color: #1F3A0A; font-size: 16.5px; line-height: 1.15; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .btn.y { border-image-source: url(sprites/ui-btn-yellow.png); color: #5A3A00; }
  .btn:active:not(:disabled), .btn[aria-busy="true"] { border-width: 9px 10px 9px; border-image: url(sprites/ui-btn-green-down.png) 9 10 9 fill / 9px 10px 9px stretch; transform: translateY(2px); }
  .btn:disabled { border-width: 9px 10px; border-image: url(sprites/ui-btn-off.png) 9 10 fill / 9px 10px stretch; color: #4F4034; cursor: default; }
  .btn small { display: inline-flex; align-items: center; gap: 3px; font-size: 14px; }
  .btn small img { width: 14px; height: 13px; }

  .hud { margin-top: 10px; display: grid; grid-template-columns: 104px 1fr; gap: 4px 14px; align-items: center; }
  .hud .crate { width: 104px; height: 100px; }
  .hud .label { font-size: 16.5px; color: var(--soft); }
  .hud .count { font-size: 33px; line-height: 1.1; }
  .bar { height: 12px; border: 2px solid #5B3A1A; background: var(--track); margin: 6px 0 4px; }
  .bar i { display: block; height: 100%; background: var(--leaf); }
  .hud .full { font-size: 15px; color: var(--soft); }
  .hud .top2 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .coins { display: inline-flex; align-items: center; gap: 5px; font-size: 16.5px; }
  .hud .btn { grid-column: 1 / -1; min-height: 56px; font-size: 22px; margin-top: 6px; flex-direction: row; }
  /* 결과 안내: 어느 탭에서나 보이게 아래 탭 위에 띄운다 */
  .toast { position: fixed; left: 50%; bottom: calc(78px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 6; width: max-content; max-width: calc(100% - 24px);
           margin: 0; padding: 8px 14px; font-size: 15px; font-weight: 600; text-align: center; color: #FFF6D8; background: #4A2E14; border: 2px solid #C98A2E; pointer-events: none; }
  .toast:empty { display: none; }
  .banner { margin-top: 10px; font-size: 15px; display: flex; align-items: center; gap: 10px; }
  .banner p { flex: 1; }
  .week { margin-top: 10px; }
  .week h2, .sec { font-size: 16.5px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 6px; }
  .stats b { display: block; font-size: 22px; font-weight: 700; }
  .stats span, .week .more { font-size: 14px; color: var(--soft); }
  .week .more { margin-top: 6px; }
  .dim { opacity: .55; }

  .sec { margin: 14px 2px 8px; color: var(--page-ink); }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .tile { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; }
  .tile .pic { height: 96px; display: flex; align-items: flex-end; justify-content: center; }
  .tile .pic img { max-height: 96px; }
  .tile.locked .pic img { filter: brightness(0); opacity: .3; }
  .tile b { font-size: 16.5px; font-weight: 700; overflow-wrap: anywhere; }
  .tile .sub, .card .sub { font-size: 14px; color: var(--soft); }
  .tile .trait { font-size: 14px; color: #3F6B0A; }
  .tile .btn { width: 100%; margin-top: auto; }
  .tile .sub { margin-bottom: 6px; }
  .why { font-size: 14px; color: #8A3B12; min-height: 0; }
  .card { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: center; margin-bottom: 10px; }
  .card .who { display: flex; align-items: flex-end; min-width: 60px; justify-content: center; }
  .card .who .spr { background-repeat: no-repeat; animation: play 1.5s steps(8) infinite; }
  .card b { font-size: 16.5px; }
  .card .acts { grid-column: 1 / -1; display: flex; gap: 8px; margin-top: 6px; }
  .card .acts .btn { flex: 1; }

  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center; padding: 0 8px env(safe-area-inset-bottom);
          border: solid transparent; border-width: 6px 8px; border-image: url(sprites/ui-plank.png) 6 8 fill / 6px 8px stretch; }
  .tabs button { flex: 1; max-width: 160px; min-height: 56px; background: none; border: 0; color: #FFE9B8; font-size: 16.5px; display: flex; flex-direction: column;
                 align-items: center; justify-content: center; gap: 2px; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .tabs button img { height: 25px; }
  .tabs button[aria-selected="true"] { color: #FFD84A; box-shadow: inset 0 -4px 0 #FFD84A; }

  dialog.sheet { margin: auto auto 0; padding: 0; border: 0; background: none; width: 100%; max-width: 480px; }
  dialog.sheet::backdrop { background: rgba(20, 14, 6, .55); }
  .sheet .panel { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
  .plots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 10px 0; }
  .plots button { background: none; border: 2px solid #C9A56B; padding: 2px 0 0; min-height: 76px; font-size: 14px; color: var(--ink); cursor: pointer; }
  .plots button img { width: 62px; height: 55px; display: block; margin: 0 auto; }
  .plots button:disabled { opacity: .4; }

  .party { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 20; }
  .party .panel { width: 220px; text-align: center; animation: pop 2.6s ease-out forwards; }
  .party b { display: block; font-size: 16.5px; margin-bottom: 6px; }
  .party span { display: block; margin-top: 6px; font-size: 16.5px; }
  @keyframes pop { 0% { transform: translateY(40vh) scale(.3); opacity: 0 } 18% { transform: none; opacity: 1 } 80% { opacity: 1 } 100% { opacity: 0 } }
  .fly { position: fixed; z-index: 15; width: 18px; height: 16px; pointer-events: none; }

  .gate { margin-top: 12px; text-align: center; }
  .gate h1 { font-size: 22px; margin: 6px 0; }
  .gate ol { text-align: left; margin: 10px 0 0; padding-left: 1.3em; }
  footer { margin-top: 20px; font-size: 14px; color: var(--page-soft); text-align: center; }
  footer a { color: inherit; }
  @media (prefers-reduced-motion: reduce) {
    .w .spr, .card .who .spr, .w .zzz { animation: none; }
    .party .panel { animation: fadeonly 2.6s forwards; }
    @keyframes fadeonly { 0%, 100% { opacity: 0 } 10%, 80% { opacity: 1 } }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="brand px"><img src="sprites/icon-64.png" alt="" width="26" height="26">Lemon Desk</span>
    <span class="chip" id="chip" hidden></span>
  </header>

  <main id="app" hidden>
    <section id="tab-orchard" role="tabpanel" aria-labelledby="t-orchard">
      <div class="scene" id="scene" role="group" tabindex="0" aria-label="과수원"><div class="world" id="world"><div class="ground"></div></div></div>
      <p class="hint" id="hint" hidden></p>
      <div class="panel hud">
        <img class="crate" id="crate-pic" src="sprites/crate-0.png" alt="" width="104" height="100">
        <div>
          <div class="top2"><span class="label px" data-t="crate">창고</span>
            <span class="coins px num"><img src="sprites/coin.png" alt="" width="18" height="16"><span id="coins">0</span></span></div>
          <div class="count px num" id="count">0 / 0</div>
          <div class="bar" aria-hidden="true"><i id="bar" style="width:0"></i></div>
          <div class="full num" id="full"></div>
        </div>
        <button class="btn px" id="sell" type="button" data-t="sell">모두 팔기</button>
      </div>
      <div class="panel banner" id="banner" hidden><p id="banner-text"></p><button class="btn y px" id="retry" type="button" hidden></button></div>
      <div class="panel week" id="week" hidden>
        <h2 class="px" data-t="week">이번 주</h2>
        <div class="stats">
          <div><b class="px num" id="w-h">0</b><span data-t="picked">딴 레몬</span></div>
          <div><b class="px num" id="w-s">0</b><span data-t="soldN">판 레몬</span></div>
          <div><b class="px num" id="w-e">0</b><span data-t="earned">번 코인</span></div>
        </div>
        <p class="more num" id="w-more"></p>
      </div>
    </section>

    <section id="tab-plant" role="tabpanel" aria-labelledby="t-plant" hidden>
      <h2 class="sec px" id="field"></h2>
      <div class="grid" id="kinds"></div>
    </section>

    <section id="tab-crew" role="tabpanel" aria-labelledby="t-crew" hidden>
      <h2 class="sec px" data-t="crew">일꾼</h2>
      <div id="crew"></div>
      <h2 class="sec px" data-t="crateUp">창고 넓히기</h2>
      <div id="crate"></div>
    </section>
  </main>

  <section class="gate panel" id="gate" hidden>
    <img id="gate-pic" src="sprites/m-pair.png" alt="">
    <h1 class="px" id="gate-title"></h1>
    <p id="gate-text"></p>
    <ol id="gate-steps"></ol>
  </section>

  <footer>
    <p id="home-tip"></p>
    <p><a href="../privacy.html" data-t="privacy">개인정보 처리방침</a></p>
  </footer>
</div>

<p class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></p>
<nav class="tabs px" id="tabs" role="tablist" hidden>
  <button type="button" role="tab" id="t-orchard" aria-controls="tab-orchard" aria-selected="true"><img src="sprites/icon-orchard.png" alt=""><span data-t="tOrchard">과수원</span></button>
  <button type="button" role="tab" id="t-plant" aria-controls="tab-plant" aria-selected="false"><img src="sprites/icon-plant.png" alt=""><span data-t="tPlant">심기</span></button>
  <button type="button" role="tab" id="t-crew" aria-controls="tab-crew" aria-selected="false"><img src="sprites/icon-crew.png" alt=""><span data-t="tCrew">일꾼</span></button>
</nav>

<dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
  <div class="panel">
    <b class="px" id="sheet-title"></b>
    <div class="plots" id="plots"></div>
    <button class="btn y px" id="sheet-cancel" type="button" style="width:100%"></button>
  </div>
</dialog>

<script>
(() => {
  const LOCAL = /^(127\.0\.0\.1|localhost)$/.test(location.hostname);
  const API = LOCAL ? location.origin + '/lemondesk/api/relay/' : 'https://lemondesk-api.interaction.hnine.com/api/relay/';
  const S = 'sprites/';
  const en = (navigator.language || '').toLowerCase().startsWith('en');
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ro = s => { const c = s.charCodeAt(s.length - 1) - 0xAC00, f = c >= 0 && c < 11172 ? c % 28 : 0; return s + (f && f !== 8 ? '으로' : '로'); }; // ㄹ 받침은 '로'
  const obj = s => { const c = s.charCodeAt(s.length - 1) - 0xAC00; return s + (c >= 0 && c < 11172 && c % 28 ? '을' : '를'); };
  const T = en ? {
    crate: 'Crate', sell: 'Sell all', sellFor: v => `Sell all +${v}`, week: 'This week', picked: 'picked', soldN: 'sold', earned: 'coins earned',
    crew: 'Workers', crateUp: 'Bigger crate', privacy: 'Privacy Policy', tOrchard: 'Orchard', tPlant: 'Plant', tCrew: 'Workers',
    fullIn: t => `Full in ${t}`, full: 'The crate is full', slow: 'Filling slowly', field: (n, m) => `Field ${n} / ${m}`, fieldFull: (n, m) => `Field ${n} / ${m} · full, so you can replant`,
    kinds: {eureka: 'Eureka lemon', kumquat: 'Kumquat', meyer: 'Meyer lemon', calamansi: 'Calamansi', lime: 'Lime', blood: 'Blood orange', yuja: 'Yuja',
      grapefruit: 'Grapefruit', pink: 'Pink lemon', hallabong: 'Hallabong', buddha: "Buddha's hand", golden: 'Golden lemon', rainbow: 'Rainbow lemon',
      redhyang: 'Red-hyang', cheonhye: 'Cheonhyehyang', bergamot: 'Bergamot', pomelo: 'Pomelo', fingerlime: 'Finger lime', trifoliate: 'Trifoliate orange',
      snowyuja: 'Snowflake yuja', moonlemon: 'Moonlight lemon'},
    traits: {moonlemon: 'Fruits only at night', snowyuja: 'Twice as fast in winter', trifoliate: 'Neighbours grow faster', fingerlime: 'Tiny fruit, very quickly', pomelo: 'Few but big and pricey'},
    roles: {planter: 'Planter', caretaker: 'Caretaker', harvester: 'Harvester'},
    jobs: {planter: 'Raises lemon prices', caretaker: 'Makes trees grow faster', harvester: 'Picks fruit into the crate'},
    seasons: {spring: 'Spring · trees grow faster', summer: 'Summer · lemons sell for more', autumn: 'Autumn · faster harvest', winter: 'Winter · yuja sells for more'},
    owned: (n, e) => `${n} planted · ${e} coins each`, ownedOld: n => `${n} planted`, level: (l, m) => `Level ${l} / ${m}`, none: 'Not hired yet',
    crateLevel: (l, c) => `Level ${l} · holds ${c}`, plantBtn: 'Plant', swapBtn: 'Replant', unlockBtn: 'Unlock', hireBtn: 'Hire', upBtn: 'Level up', hire2Btn: 'Hire one more',
    growBtn: 'Expand', maxed: 'Max level', poor: 'Not enough coins', fieldIsFull: 'Field is full', more: n => `${n} more kinds after this`,
    swapTitle: k => `Replace which tree with ${k}?`, cancel: 'Cancel', plot: n => `Plot ${n}`,
    connecting: 'Connecting…', online: 'Mac connected', asleepChip: 'Mac asleep', offline: "Can't connect", staleChip: ago => `As of ${ago}`,
    asleep: ago => `Your Mac is asleep${ago ? ` (last seen ${ago})` : ''}. You can only look for now.`, noState: 'Wake your Mac to see your orchard.',
    offlineText: "Can't reach the server. Showing the last orchard you saw.", retry: 'Retry', pan: 'Swipe the orchard sideways to look around.',
    upgrade: 'Update Lemon Desk on your Mac to 1.7.1 to see your orchard here.', dex: (d, s) => `Collection ${d}/20 · Secrets ${s}/20`,
    sold: e => e > 0 ? `Sold! +${fmt(e)} coins` : 'No lemons to sell yet', planted: k => `Planted a ${T.kinds[k]}`, swapped: k => `Replanted with a ${T.kinds[k]}`,
    unlocked: k => `Unlocked ${T.kinds[k]}. You can plant it now`, hired: r => `${T.roles[r]} leveled up`, hired2: r => `One more ${T.roles[r].toLowerCase()} joined`, grown: 'Crate expanded',
    unavailable: "That can't be done right now", noAnswer: "Your Mac didn't answer. Try again in a moment.", tooMany: 'Too many taps. Try again in a moment.',
    failed: "Couldn't send. Check your connection.", newKind: 'A new tree is open!',
    welcome: 'Open Lemon Desk on your Mac', welcomeText: 'This page shows your Mac orchard on your phone.',
    steps: ['On your Mac, click the lemon in the menu bar › Open Orchard… › Settings, and turn on Phone view.', 'Scan the QR code with your phone camera.'],
    lost: 'Disconnected', lostText: 'The connection was reset on your Mac. Scan the new QR code in Settings › Phone view.',
    homeTip: 'Tip: add this page to your Home Screen to open it like an app.',
    ago: s => s < 60 ? 'just now' : s < 3600 ? `${Math.round(s / 60)} min ago` : `${Math.round(s / 3600)} h ago`,
  } : {
    crate: '창고', sell: '모두 팔기', sellFor: v => `모두 팔기 +${v}`,
    fullIn: t => `가득까지 ${t}`, full: '창고가 가득 찼어요', slow: '천천히 차는 중', field: (n, m) => `밭 ${n} / ${m}칸`, fieldFull: (n, m) => `밭 ${n} / ${m}칸 · 다 차서 바꿔 심을 수 있어요`,

      const w = s.workers.find(x => x.role === r.role); if (!w) continue;
      r.lv.textContent = w.level ? T.level(w.level, w.max) : T.none;
      setBuy(r.up, r.why, w.level ? T.upBtn : T.hireBtn, w.cost, T.maxed);
      if (r.b2) { setBuy(r.b2, null, T.hire2Btn, w.second, ''); if (w.second != null && w.second > s.coins) r.why.textContent = T.poor; }
    }
  }
  // 바꿔 심기: 어느 밭과 바꿀지 고른다
  function pickPlot(kind) {
    const s = state();
    $('sheet-title').textContent = T.swapTitle(T.kinds[kind] || kind);
    $('plots').replaceChildren(...s.plots.map((p, i) => {
      const b = el('button'); b.type = 'button'; b.disabled = p.kind === kind;
      const im = el('img'); im.src = `${S}tree-${p.kind}-${Math.min(7, p.stage)}.png`; im.alt = '';
      b.append(im, document.createTextNode(String(i + 1))); b.setAttribute('aria-label', `${T.plot(i + 1)}, ${T.kinds[p.kind] || p.kind}`);
      b.onclick = () => { closeSheet(); send({action: 'replant', kind, plot: i}); };
      return b;
    }));
    $('sheet').showModal(); $('sheet-cancel').focus();
  }
  const closeSheet = () => $('sheet').close(); // 포커스는 브라우저가 눌렀던 버튼으로 되돌린다
  $('sheet-cancel').onclick = closeSheet;
  $('sheet').onclick = e => { if (e.target === $('sheet')) closeSheet(); }; // 바깥(배경)을 누르면 닫는다

  const party = (title, img, name) => {
    const box = el('div', 'party'); box.setAttribute('aria-hidden', 'true');
    const c = el('div', 'panel'), i = el('img'); i.src = img; i.alt = '';
    c.append(el('b', 'px', title), i, el('span', 'px', name)); box.append(c); document.body.append(box);
    setTimeout(() => box.remove(), 2700);
  };

  function render() {
    $('gate').hidden = true; $('app').hidden = false; $('tabs').hidden = false; $('chip').hidden = false;
    const s = state();
    const ago = data && data.macSeen ? T.ago(Math.max(0, nowSec() - data.macSeen)) : '';
    $('chip').className = 'chip' + (canAct() ? ' on' : '');
    $('chip').textContent = stale && !failed ? T.staleChip(T.ago((Date.now() - seenAt) / 1000)) : failed ? T.offline : data.online ? T.online : T.asleepChip;
    const note = failed ? T.offlineText : !s ? T.noState : !data.online && !stale ? T.asleep(ago) : '';
    $('banner').hidden = !note; $('banner-text').textContent = note; $('retry').hidden = !failed;
    document.querySelector('.hud').classList.toggle('dim', failed);
    for (const r of s?.results || []) {
      const p = pending.get(r.id); if (!p) continue;
      pending.delete(r.id); override = null;
      if (r.ok && p.action === 'unlock') party(T.newKind, `${S}tree-${p.kind}-6.png`, T.kinds[p.kind] || p.kind);
      toast(!r.ok ? T[r.reason] || T.unavailable : p.action === 'sell' ? T.sold(r.earned || 0) : p.action === 'plant' ? T.planted(p.kind) : p.action === 'replant' ? T.swapped(p.kind)
        : p.action === 'unlock' ? T.unlocked(p.kind) : p.action === 'hire' ? T.hired(p.role) : p.action === 'hire2' ? T.hired2(p.role) : T.grown);
    }
    for (const [id, p] of pending) if (Date.now() - p.at > 8000) { pending.delete(id); override = null; toast(T.noAnswer); }
    document.querySelectorAll('.btn[aria-busy="true"]').forEach(b => { if (!pending.size) b.removeAttribute('aria-busy'); });
    $('week').hidden = !(s && s.week);
    if (s && s.week) {
      $('w-h').textContent = short(s.week.harvested); $('w-s').textContent = short(s.week.sold); $('w-e').textContent = short(s.week.earned);
      $('w-more').textContent = [T.seasons[s.season], s.dex != null && s.secrets != null ? T.dex(s.dex, s.secrets) : ''].filter(Boolean).join(' · ');
    }
    renderScene(); renderPlant(); renderCrew(); tick();
  }

  let timer;
  function accept(d) {
    offset = d.now * 1000 - Date.now(); data = d; failed = false; stale = false; seenAt = Date.now();
    if (d.state) try { localStorage.setItem('ld-remote-last', JSON.stringify({d, at: seenAt})); } catch (e) {}
  }
  async function refresh() {
    clearTimeout(timer);
    try { accept(await api('view')); } catch (e) {
      if (e.status === 401) { localStorage.removeItem('ld-remote'); localStorage.removeItem('ld-remote-last'); history.replaceState(null, '', location.pathname); gate(T.lost, T.lostText, null, 'prop-sign-0'); return; }
      failed = true;
    }
    if (data) render(); else { $('app').hidden = false; $('chip').hidden = false; $('chip').textContent = T.offline; $('banner').hidden = false; $('banner-text').textContent = T.offlineText; $('retry').hidden = false; }
    if (document.visibilityState === 'visible') timer = setTimeout(refresh, pending.size ? 1000 : 5000);
  }
  // 명령: 서버가 Mac 의 처리 결과를 최대 3초 기다렸다가 새 상태와 함께 돌려준다. 그 전에 화면은 먼저 바꿔 둔다.
  async function send(cmd, btn) {
    const id = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(16) + Math.random().toString(16).slice(2)).slice(0, 40);
    if (btn) { btn.disabled = true; btn.setAttribute('aria-busy', 'true'); }
    if (navigator.vibrate) navigator.vibrate(12);
    pending.set(id, {...cmd, at: Date.now()});
    try {
      const d = await api('command', {method: 'POST', body: JSON.stringify({id, ...cmd})});
      if (d.now) accept(d);
    } catch (e) {
      pending.delete(id); override = null;
      toast(e.status === 409 ? T.asleep('') : e.status === 429 ? T.tooMany : T.failed);
    }
    if (data) render(); // 결과를 받은 버튼은 render 가 다시 풀어 준다
    clearTimeout(timer); timer = setTimeout(refresh, pending.size ? 1000 : 5000);
  }
  $('sell').onclick = () => {
    const s = state(), m = moment();
    override = {crate: 0, coins: s.coins + m.value, until: Date.now() + 5000};
    flyCoins(); tick();
    send({action: 'sell'}, $('sell'));
  };
  $('retry').onclick = refresh;

  // 탭
  const tabs = ['orchard', 'plant', 'crew'];
  const show = name => tabs.forEach(t => { $('tab-' + t).hidden = t !== name; $('t-' + t).setAttribute('aria-selected', t === name); });
  tabs.forEach(t => { $('t-' + t).onclick = () => { show(t); scrollTo(0, 0); }; });
  const startTab = new URLSearchParams(location.search).get('tab'); // 확인·캡처용 ?tab=plant|crew
  if (tabs.includes(startTab)) show(startTab);

  // 마지막으로 본 과수원을 바로 그린다(서버가 Mac 을 기다리는 동안 빈 화면이 없게). 타임라인이 있어 숫자는 계속 흐른다.
  try {
    const last = JSON.parse(localStorage.getItem('ld-remote-last') || 'null');
    if (last && last.d && last.d.state) { data = last.d; seenAt = last.at; stale = true; offset = 0; render(); }
  } catch (e) {}
  if (!data) { $('app').hidden = false; $('tabs').hidden = false; $('chip').hidden = false; $('chip').textContent = T.connecting; tick(); }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });
  addEventListener('online', refresh);
  setInterval(() => { if (document.visibilityState === 'visible') tick(); }, 1000);
  refresh();
})();
</script>
</body>
</html>
