<!doctype html>
<!-- ponytail: 이웃 초대 링크(1.14) 정적 한 장. ?c=ABCDEF 를 읽어 앱(lemondesk://neighbor?code=…)을 열어 보고, 코드와 내려받기(사이트 첫 페이지)를 보여 준다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lemon Desk 이웃 초대</title>
<meta name="description" content="Lemon Desk 과수원에서 이웃이 되어 달라는 초대예요.">
<meta name="robots" content="noindex">
<link rel="icon" href="../icon.png?v=2">
<style>
  :root { --bg: #FFFBEC; --ink: #23511F; --text: #3E4A33; --muted: #6F7862; --line: #EDE6CC; --lemon: #F5CE2E; --lemon-soft: #FFF3C2; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14170F; --ink: #EEF3DF; --text: #C9CFBA; --muted: #959C85; --line: #2A2F21; --lemon-soft: #2C2A14; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 18px/1.7 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
         word-break: keep-all; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 56px 24px 64px; }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; font-weight: 700; color: var(--ink); text-decoration: none; }
  .brand img { width: 40px; height: 40px; border-radius: 9px; }
  h1 { margin: 0 0 12px; color: var(--ink); font-size: 30px; line-height: 1.3; letter-spacing: -0.03em; }
  p { margin: 0 0 16px; }
  .muted { color: var(--muted); font-size: 15px; }
  .code { margin: 28px 0; padding: 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--lemon-soft); text-align: center; }
  .code b { display: block; color: var(--ink); font: 700 34px/1.2 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: 0.12em; }
  .buttons { display: flex; flex-wrap: wrap; gap: 12px; }
  .btn { display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 10px; font: inherit; font-weight: 700;
         text-decoration: none; cursor: pointer; border: 0; }
  .primary { background: var(--lemon); color: #23511F; }
  .primary:hover { background: #E9BF14; }
  .ghost { background: none; color: var(--ink); border: 1px solid var(--line); }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="wrap">
  <a class="brand" href="../"><img src="../icon.png?v=2" alt="" width="40" height="40">Lemon Desk</a>
  <h1>이웃이 되어 주세요</h1>
  <p>Lemon Desk 과수원에서 이웃 초대가 왔어요. 이웃끼리는 물을 주고, 과일을 선물하고, 서리도 하지 않아요.</p>

  <div id="has-code" hidden>
    <div class="code"><span class="muted">초대 코드</span><b id="code"></b></div>
    <div class="buttons">
      <a class="btn primary" id="open" href="#">앱에서 열기</a>
      <button class="btn ghost" id="copy" type="button">코드 복사</button>
    </div>
    <p class="muted" id="copied" role="status" aria-live="polite"></p>
    <p class="muted">앱이 열리지 않으면 관리 창 › 이웃 › 친구와 코드로 맺기에 코드를 넣어 주세요.</p>
  </div>
  <p id="no-code" hidden>초대 코드가 없는 주소예요. 받은 링크를 다시 확인해 주세요.</p>

  <hr style="border: 0; border-top: 1px solid var(--line); margin: 40px 0 28px;">
  <p>아직 Lemon Desk 가 없나요? 일하는 동안 화면 맨 아래에서 레몬 과수원이 자라는 무료 게임이에요(Mac, Windows 베타).</p>
  <a class="btn ghost" href="../">Lemon Desk 내려받기</a>
</main>
<script>
  const raw = new URLSearchParams(location.search).get('c') || location.pathname.split('/').filter(Boolean).pop() || '';
  const code = raw.replace(/[\s-]/g, '').toUpperCase();
  if (/^[A-HJ-NP-Z2-9]{6}$/.test(code)) {
    document.getElementById('has-code').hidden = false;
    document.getElementById('code').textContent = code.slice(0, 3) + '-' + code.slice(3);
    const app = 'lemondesk://neighbor?code=' + code;
    document.getElementById('open').href = app;
    location.href = app; // 앱이 있으면 바로 맺기 창이 열린다. 없으면 아무 일도 없이 이 페이지에 남는다.
    document.getElementById('copy').onclick = async () => {
      try { await navigator.clipboard.writeText(code); document.getElementById('copied').textContent = '코드를 복사했어요.'; }
      catch (e) { document.getElementById('copied').textContent = '복사하지 못했어요. 위 코드를 직접 적어 주세요.'; }
    };
  } else {
    document.getElementById('no-code').hidden = false;
  }
</script>
</body>
</html>
