<!doctype html>
<!-- ponytail: 정적 한 장. 데이터는 lemondesk-api 의 /api/stats(토큰 필요, 회사 인프라 환경 변수 STATS_TOKEN). 토큰은 이 브라우저 localStorage 에만 둔다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Lemon Desk 통계</title>
<link rel="icon" href="../icon.png?v=1">
<style>
  :root { --bg: #FFFBEC; --ink: #23511F; --text: #3E4A33; --muted: #6F7862; --card: #FFFFFF; --line: #EDE6CC; --bar: #3F8A3A; --grid: #EFE9D6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14170F; --ink: #EEF3DF; --text: #C9CFBA; --muted: #959C85; --card: #1C2016; --line: #2A2F21; --bar: #5FA855; --grid: #262B1E; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 24px 64px; }
  h1, h2 { color: var(--ink); margin: 0; letter-spacing: -0.02em; }
  h1 { font-size: 28px; }
  h2 { font-size: 18px; margin: 40px 0 12px; }
  .muted { color: var(--muted); }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 6px; }
  form { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  input, button { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-height: 40px; }
  button { cursor: pointer; }
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .tile b { display: block; font-size: 28px; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.3; }
  .tile span { font-size: 13px; color: var(--muted); }
  .chart { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; position: relative; }
  .chart h3 { margin: 0 0 8px; font-size: 14px; color: var(--ink); }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  svg text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -100%); display: none; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 13px; }
  td.n, th.n { text-align: right; }
  details { margin-top: 8px; }
  .note { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .err { color: #B3261E; }
  @media (prefers-color-scheme: dark) { .err { color: #F2B8B5; } }
  @media (max-width: 760px) { .tiles, .grid2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Lemon Desk 통계</h1>
  <p class="muted">설치 수는 동의와 상관없이 처음 실행 때 한 번 세고(식별자 없음), 사용 통계는 동의한 설치만 모아요.</p>
  <form id="auth">
    <label class="muted" for="token">통계 토큰</label>
    <input id="token" type="password" autocomplete="off" placeholder="STATS_TOKEN" size="28">
    <button type="submit">보기</button>
    <span id="status" class="muted" role="status" aria-live="polite"></span>
  </form>

  <div id="out" hidden>
    <h2>설치</h2>
    <div class="tiles" id="t-installs"></div>
    <h2>사용 (동의한 설치)</h2>
    <div class="tiles" id="t-usage"></div>
    <h2>최근 30일</h2>
    <div class="grid2">
      <div class="chart" id="c-installs"><h3>일별 설치</h3></div>
      <div class="chart" id="c-active"><h3>일별 활성 설치</h3></div>
    </div>
    <details>
      <summary>표로 보기</summary>
      <table id="daily"><thead><tr><th>날짜</th><th class="n">설치</th><th class="n">활성</th><th class="n">새 참여</th><th class="n">평균 사용(분)</th><th class="n">관리 창 열기</th><th class="n">판매</th></tr></thead><tbody></tbody></table>
    </details>
    <h2>분포</h2>
    <div class="grid2" id="dist"></div>
    <p class="note" id="foot"></p>
  </div>
</div>
<script>
(() => {
  // 로컬 확인(127.0.0.1, server/brag.py --static site)에서는 같은 주소의 API 와 #token= 을 쓴다
  const local = location.hostname === '127.0.0.1';
  const API = local ? '/lemondesk/api/stats?days=30' : 'https://lemondesk-api.interaction.hnine.com/api/stats?days=30';
  if (local && location.hash.startsWith('#token=')) localStorage.setItem('ld-stats-token', decodeURIComponent(location.hash.slice(7)));
  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const n = v => new Intl.NumberFormat('ko').format(v);
  const md = d => { const [, m, dd] = d.split('-').map(Number); return `${m}/${dd}`; };
  const tile = (box, value, label) => { const t = el('div', 'tile'); t.append(el('b', null, value), el('span', null, label)); box.append(t); };

  function bars(box, rows, key, unit) {
    const W = 520, H = 150, top = 14, bottom = 22, left = 28;
    const max = Math.max(1, ...rows.map(r => r[key]));
    const bw = (W - left) / rows.length;
    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', `${box.querySelector('h3').textContent}, 최대 ${max}${unit}`);
    const add = (name, attrs, text) => { const e = document.createElementNS(NS, name); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; svg.append(e); return e; };
    const y = v => top + (H - top - bottom) * (1 - v / max);
    add('line', {x1: left, x2: W, y1: y(0), y2: y(0), stroke: 'var(--line)', 'stroke-width': 1});
    add('line', {x1: left, x2: W, y1: y(max), y2: y(max), stroke: 'var(--grid)', 'stroke-width': 1});
    add('text', {x: left - 6, y: y(max) + 4, 'text-anchor': 'end'}, n(max));
    add('text', {x: left - 6, y: y(0) + 4, 'text-anchor': 'end'}, '0');
    const tip = el('div', 'tip'); box.append(tip);
    rows.forEach((r, i) => {
      const x = left + i * bw + 1, w = Math.max(1, bw - 2), v = r[key];   // 막대 사이 2px 간격
      if (v > 0) {
        const h = y(0) - y(v), rr = Math.min(4, w / 2, h);
        add('path', {d: `M${x},${y(0)} V${y(v) + rr} Q${x},${y(v)} ${x + rr},${y(v)} H${x + w - rr} Q${x + w},${y(v)} ${x + w},${y(v) + rr} V${y(0)} Z`, fill: 'var(--bar)'});
      }
      if (i % 7 === rows.length % 7 || i === rows.length - 1) add('text', {x: x + w / 2, y: H - 6, 'text-anchor': 'middle'}, md(r.day));
      const hit = add('rect', {x: left + i * bw, y: top, width: bw, height: H - top - bottom, fill: 'transparent'});   // 막대보다 큰 히트 영역
      hit.append(Object.assign(document.createElementNS(NS, 'title'), {textContent: `${md(r.day)} ${n(v)}${unit}`}));
      hit.addEventListener('mouseenter', () => {
        tip.textContent = `${md(r.day)} · ${n(v)}${unit}`; tip.style.display = 'block';
        const rect = svg.getBoundingClientRect(), s = rect.width / W;
        tip.style.left = (svg.offsetLeft + (x + w / 2) * s) + 'px'; tip.style.top = (svg.offsetTop + y(v) * s - 6) + 'px';
      });
      hit.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
    });
    box.append(svg);
  }

  function dist(title, obj) {
    const box = el('div', 'chart'); box.append(el('h3', null, title));
    const t = el('table'); const total = Object.values(obj).reduce((a, b) => a + b, 0);
    t.innerHTML = '<thead><tr><th>값</th><th class="n">수</th><th class="n">비율</th></tr></thead>';
    const tb = el('tbody');
    for (const [k, v] of Object.entries(obj)) {
      const tr = el('tr'); tr.append(el('td', null, k || '(없음)'), el('td', 'n', n(v)), el('td', 'n', total ? Math.round(v * 100 / total) + '%' : '-')); tb.append(tr);
    }
    if (!total) { const tr = el('tr'); tr.append(Object.assign(el('td', 'muted', '아직 없음'), {colSpan: 3})); tb.append(tr); }
    t.append(tb); box.append(t); $('dist').append(box);
  }

  function render(s) {
    $('out').hidden = false;
    ['t-installs', 't-usage', 'dist'].forEach(id => $(id).textContent = '');
    ['c-installs', 'c-active'].forEach(id => $(id).querySelectorAll('svg,.tip').forEach(e => e.remove()));
    const i = s.installs, u = s.usage;
    tile($('t-installs'), n(i.total), '누적 설치');
    tile($('t-installs'), n(i.today), '오늘 설치');
    tile($('t-installs'), n(i.new), '새 설치');
    tile($('t-installs'), n(i.upgrade), '업데이트로 처음 센 설치');
    tile($('t-usage'), `${n(u.active.dau)} · ${n(u.active.wau)} · ${n(u.active.mau)}`, '활성 설치 (오늘 · 7일 · 30일)');
    const today = s.daily.length ? s.daily[s.daily.length - 1] : null;
    tile($('t-usage'), today && today.day === s.today ? `${n(today.avg_minutes)}분` : '-', '오늘 평균 사용 시간');
    const r = u.retention7;
    tile($('t-usage'), r.cohort ? `${Math.round(r.retained * 100 / r.cohort)}%` : '-', `7일 잔존율 (${n(r.retained)}/${n(r.cohort)})`);
    tile($('t-usage'), n(u.participants), `통계 참여 설치 (오늘 새로 ${n(u.new_today)})`);
    // 30일을 빈 날까지 채운다
    const byDay = Object.fromEntries(s.daily.map(d => [d.day, d]));
    const days = [];
    for (let k = 29; k >= 0; k--) {
      const d = new Date(s.today + 'T00:00:00'); d.setDate(d.getDate() - k);
      const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      days.push(byDay[key] || {day: key, installs: 0, active: 0, new: 0, avg_minutes: 0, opens: 0, sales: 0});
    }
    bars($('c-installs'), days, 'installs', '건');
    bars($('c-active'), days, 'active', '대');
    const tb = $('daily').querySelector('tbody'); tb.textContent = '';
    for (const d of [...days].reverse()) {
      const tr = el('tr');
      [d.day, d.installs, d.active, d.new, d.avg_minutes, d.opens, d.sales].forEach((v, k) => tr.append(el('td', k ? 'n' : null, k ? n(v) : v)));
      tb.append(tr);
    }
    dist('설치 버전 (누적)', i.versions); dist('설치 CPU (누적)', i.arch);
    dist('활성 버전 (7일)', u.versions); dist('활성 macOS (7일)', u.os);
    $('foot').textContent = `기준일 ${s.today} (한국 시간) · 이번 주 게시판: 게시물 ${n(s.board.posts_this_week)}개, 별 ${n(s.board.stars_this_week)}개`;
  }

  async function load() {
    const token = localStorage.getItem('ld-stats-token') || '';
    if (!token) return;
    $('status').textContent = '불러오는 중…'; $('status').className = 'muted';
    try {
      const r = await fetch(API, {headers: {Authorization: 'Bearer ' + token}});
      if (r.status === 403) throw new Error('토큰이 맞지 않아요.');
      if (!r.ok) throw new Error('불러오지 못했어요. (' + r.status + ')');
      render(await r.json());
      $('status').textContent = '';
    } catch (e) {
      $('status').textContent = e.message || '불러오지 못했어요.'; $('status').className = 'err';
    }
  }
  $('auth').onsubmit = e => { e.preventDefault(); localStorage.setItem('ld-stats-token', $('token').value.trim()); load(); };
  load();
})();
</script>
</body>
</html>
